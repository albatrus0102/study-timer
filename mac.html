<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<title>25:00</title>
<style>
  :root {
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden; /* no scrollbars */
    font-family: ui-rounded, -apple-system, BlinkMacSystemFont, "Segoe UI", "SF Mono", "Menlo", monospace;
    user-select: none;
  }

  #app {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* Huge centered timer digits */
  #timer {
    font-size: 20vmin;
    font-weight: 500;
    letter-spacing: 0.03em;
    color: rgba(255,255,255,0.85);
    font-variant-numeric: tabular-nums;
    line-height: 1;
    font-family: ui-rounded, "SF Mono", "Menlo", "Consolas", monospace;
    transition: color 0.3s ease;
  }

  /* mode label + session count */
  #meta {
    margin-top: 1.2vmin;
    display: flex;
    align-items: center;
    gap: 1.4vmin;
    color: rgba(255,255,255,0.35);
    font-size: 2vmin;
    letter-spacing: 0.1em;
  }

  #modeLabel { text-transform: uppercase; }

  #studyTime { opacity: 0.9; }

  /* bottom controls */
  #controls {
    position: absolute;
    bottom: 22px;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 22px;
    font-size: 15px;
    letter-spacing: 0.03em;
  }

  .ctrl-btn {
    background: none;
    border: none;
    color: rgba(255,255,255,0.65);
    cursor: pointer;
    font-family: inherit;
    font-size: 15px;
    padding: 4px 6px;
    opacity: 0.75;
    transition: opacity 0.15s ease, color 0.15s ease;
  }
  .ctrl-btn:hover { opacity: 1; color: rgba(255,255,255,0.9); }
  .ctrl-btn:active { opacity: 0.7; }

  /* focus-duration presets */
  #presets {
    position: absolute;
    bottom: 54px;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    font-size: 14px;
    letter-spacing: 0.03em;
  }

  .preset-btn {
    background: none;
    border: none;
    color: rgba(255,255,255,0.65);
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
    padding: 3px 4px;
    opacity: 0.85;
    transition: opacity 0.15s ease, color 0.15s ease;
  }
  .preset-btn:hover { opacity: 0.8; color: rgba(255,255,255,0.9); }
  .preset-btn.active {
    opacity: 1;
    color: rgba(255,255,255,0.95);
    text-decoration: underline;
  }

  /* help hint */
  #hint {
    position: absolute;
    bottom: 4px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 12px;
    color: rgba(255,255,255,0.3);
    letter-spacing: 0.02em;
    pointer-events: none;
  }

  /* music toggle + panel */
  #musicPanel {
    position: absolute;
    left: 18px;
    bottom: 60px;
    width: 300px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    padding: 10px;
    backdrop-filter: blur(2px);
    transition: opacity 0.2s ease;
  }

  #musicPanel.collapsed {
    /* keep iframe alive in DOM but hide visually per spec */
    height: 0;
    padding: 0;
    border: none;
    overflow: hidden;
    opacity: 0;
    pointer-events: none;
  }

  #musicPanel .row {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
  }

  #musicUrl {
    flex: 1;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 4px;
    color: rgba(255,255,255,0.75);
    font-size: 11px;
    padding: 6px 8px;
    outline: none;
    font-family: inherit;
    min-width: 0;
  }
  #musicUrl::placeholder { color: rgba(255,255,255,0.25); }

  #musicLoad {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 4px;
    color: rgba(255,255,255,0.7);
    font-size: 11px;
    padding: 6px 10px;
    cursor: pointer;
    font-family: inherit;
  }
  #musicLoad:hover { background: rgba(255,255,255,0.14); color: #fff; }

  #musicError {
    font-size: 10px;
    color: rgba(255,120,120,0.7);
    min-height: 14px;
    margin-bottom: 4px;
  }

  #musicFrameWrap {
    width: 100%;
    height: 180px;
    border-radius: 4px;
    overflow: hidden;
    background: rgba(255,255,255,0.02);
  }

  #musicFrame {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }

  #musicControlsRow {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-top: 8px;
  }

  .music-mini-btn {
    background: none;
    border: none;
    color: rgba(255,255,255,0.4);
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
    padding: 2px 6px;
    opacity: 0.6;
    transition: opacity 0.15s ease, color 0.15s ease;
  }
  .music-mini-btn:hover { opacity: 1; color: rgba(255,255,255,0.9); }
  .music-mini-btn:active { opacity: 0.75; }

  #musicTrackTitle {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 10px;
    color: rgba(255,255,255,0.3);
  }

  /* custom duration panel */
  #customDim {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: none;
    z-index: 60;
  }
  #customDim.open { display: block; }

  #customPanel {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 260px;
    background: rgba(22,22,22,0.97);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px;
    padding: 18px;
    backdrop-filter: blur(12px);
    z-index: 61;
    display: none;
  }
  #customPanel.open { display: block; }

  #customPanel h3 {
    margin: 0 0 10px;
    font-size: 12px;
    font-weight: 400;
    color: rgba(255,255,255,0.5);
    letter-spacing: 0.05em;
  }

  #customPanel .row {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
  }

  #customMinutes {
    flex: 1;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 4px;
    color: rgba(255,255,255,0.85);
    font-size: 16px;
    padding: 8px 10px;
    outline: none;
    font-family: inherit;
    min-width: 0;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  #customMinutes::placeholder { color: rgba(255,255,255,0.25); font-size: 12px; }
  /* hide number input spinners */
  #customMinutes::-webkit-outer-spin-button,
  #customMinutes::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  #customHint {
    font-size: 10px;
    color: rgba(255,255,255,0.25);
    text-align: center;
  }

  /* blackout (B key) */
  #blackout {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 100;
    display: none;
    cursor: none;
  }
  #blackout.on { display: block; }

  /* stats panel */
  /* ---- 집중 측정 (FocusSensor) ---- */
  #focusChip {
    display: none;
    align-items: center;
    gap: 0.7vmin;
    font-size: 1.7vmin;
    letter-spacing: 0.04em;
  }
  #focusChip.on { display: inline-flex; }
  #focusChip i {
    width: 0.9vmin; height: 0.9vmin; border-radius: 50%;
    background: #1f6f4a; display: inline-block;
  }
  #focusDim {
    position: fixed; inset: 0; background: rgba(0,0,0,0.75);
    display: none; z-index: 52;
  }
  #focusDim.open { display: block; }
  #focusPanel {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 720px; max-width: 92vw; max-height: 86vh; overflow-y: auto;
    background: rgba(18,18,20,0.98); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px; padding: 20px; backdrop-filter: blur(12px);
    z-index: 53; display: none; color: #e8e8ea;
    font-size: 13px; line-height: 1.6; text-align: left;
  }
  #focusPanel.open { display: block; }
  #focusPanel h3 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
  #focusPanel h4 { margin: 20px 0 8px; font-size: 13px; font-weight: 600; }
  #focusPanel .fdim { color: rgba(255,255,255,0.45); font-size: 12px; }
  #focusPanel .frow { display: flex; gap: 9px; flex-wrap: wrap; align-items: center; margin: 14px 0; }
  #focusPanel .fbtn {
    background: #1b1d23; border: 1px solid rgba(255,255,255,0.14); color: #e8e8ea;
    border-radius: 8px; padding: 8px 14px; font: inherit; font-size: 13px; cursor: pointer;
  }
  #focusPanel .fbtn:hover { background: #23262e; }
  #focusPanel .fbtn:disabled { opacity: 0.4; cursor: default; }
  #focusPanel .fbtn.pri { background: #20313f; border-color: #2e4a5e; }
  #focusPanel .fck { display: flex; gap: 9px; align-items: flex-start; padding: 4px 0; font-size: 12px; }
  #focusPanel .fck .d { width: 8px; height: 8px; border-radius: 50%; background: #5a5a64; margin-top: 5px; flex: none; }
  #focusPanel .fck.ok .d { background: #4fa87a; }
  #focusPanel .fck.bad .d { background: #d4573a; }
  #focusPanel .fck.run .d { background: #c8a03a; }
  #focusPanel .fck .n { width: 160px; flex: none; color: rgba(255,255,255,0.75); }
  #focusPanel .fck .m { color: rgba(255,255,255,0.45); flex: 1; word-break: break-word; }
  #focusPanel .fck.bad .m { color: #e58a6f; }
  #focusPanel .fwarn {
    border: 1px solid #5e4a26; background: #22190c; border-radius: 8px;
    padding: 10px 12px; font-size: 12px; color: #d8b878; margin: 10px 0;
  }
  #focusPanel .fstage { font-size: 11px; color: rgba(255,255,255,0.4); letter-spacing: 0.08em; }
  #focusPanel .finstr { font-size: 20px; font-weight: 600; margin: 8px 0 4px; }
  #focusPanel .fcnt { font-size: 48px; font-weight: 300; font-variant-numeric: tabular-nums; }
  #focusPanel .fbar { height: 4px; background: #1a1c22; border-radius: 2px; overflow: hidden; margin-top: 12px; }
  #focusPanel .fbar i { display: block; height: 100%; background: #4fa87a; width: 0; }
  #focusCloseBtn { position: absolute; top: 14px; right: 14px; }

  #statsDim {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: none;
    z-index: 50;
  }
  #statsDim.open { display: block; }

  #statsPanel {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 360px;
    max-width: 90vw;
    max-height: 80vh;
    overflow-y: auto;
    background: rgba(22,22,22,0.97);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px;
    padding: 18px;
    backdrop-filter: blur(12px);
    z-index: 51;
    display: none;
  }
  #statsPanel.open { display: block; }

  #statsPanel h3 {
    margin: 0 0 10px;
    font-size: 12px;
    font-weight: 400;
    color: rgba(255,255,255,0.5);
    letter-spacing: 0.05em;
  }

  #statsCloseBtn {
    position: absolute;
    top: 8px;
    right: 8px;
  }

  #statsWeekChart {
    display: flex;
    align-items: flex-end;
    gap: 6px;
    height: 100px;
    margin-bottom: 8px;
  }

  .stats-bar-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    height: 100%;
    justify-content: flex-end;
  }

  .stats-bar {
    width: 100%;
    background: rgba(255,255,255,0.18);
    border-radius: 2px 2px 0 0;
    min-height: 2px;
  }
  .stats-bar.today { background: rgba(255,255,255,0.55); }

  .stats-bar-label {
    font-size: 9px;
    color: rgba(255,255,255,0.3);
  }

  #statsWeekTotal {
    font-size: 11px;
    color: rgba(255,255,255,0.4);
    margin-bottom: 20px;
  }

  #statsHeatmap {
    display: flex;
    flex-wrap: wrap;
    gap: 3px;
  }

  .stats-heat-cell {
    width: 12px;
    height: 12px;
    border-radius: 2px;
    background: rgba(255,255,255,0.04);
  }
  .stats-heat-cell.lvl1 { background: rgba(255,255,255,0.16); }
  .stats-heat-cell.lvl2 { background: rgba(255,255,255,0.36); }
  .stats-heat-cell.lvl3 { background: rgba(255,255,255,0.62); }

  #statsDayDetail {
    margin-top: 12px;
    font-size: 13px;
    color: rgba(255,255,255,0.8);
    min-height: 18px;
    text-align: center;
  }

  /* device sync section */
  #syncSection {
    margin-top: 18px;
  }
  #syncSection .row {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
  }
  #syncTokenInput {
    flex: 1;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 4px;
    color: rgba(255,255,255,0.85);
    font-size: 12px;
    padding: 6px 8px;
    outline: none;
    font-family: inherit;
    min-width: 0;
  }
  #syncTokenInput::placeholder { color: rgba(255,255,255,0.25); }
  #syncStatusRow {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  #syncStatusText {
    font-size: 11px;
    color: rgba(255,255,255,0.4);
  }
</style>
</head>
<body>
<div id="app">

  <div id="timer">25:00</div>
  <div id="meta">
    <span id="modeLabel">집중</span>
    <span id="studyTime">오늘: 0분</span>
    <span id="focusChip"><i></i><span id="focusChipText">—</span></span>
  </div>

  <div id="musicPanel" class="collapsed">
    <div class="row">
      <input id="musicUrl" type="text" placeholder="유튜브 URL 붙여넣기 (동영상 또는 재생목록)">
      <button id="musicLoad" class="ctrl-btn" style="opacity:1;">재생</button>
    </div>
    <div id="musicError"></div>
    <div id="musicFrameWrap">
      <div id="musicFrame"></div>
    </div>
    <div id="musicControlsRow">
      <button id="musicPlayPauseBtn" class="music-mini-btn" title="재생/일시정지">▶</button>
      <button id="musicNextBtn" class="music-mini-btn" title="다음 곡">⏭</button>
      <span id="musicTrackTitle"></span>
    </div>
  </div>

  <div id="presets">
    <button class="preset-btn" data-preset="25">25분</button>
    <button class="preset-btn" data-preset="50">50분</button>
    <button class="preset-btn" data-preset="80">80분</button>
    <button class="preset-btn" data-preset="100">100분</button>
    <button class="preset-btn" data-preset="custom" id="customPresetBtn">직접</button>
    <button class="preset-btn" data-preset="stopwatch" id="stopwatchPresetBtn">스톱워치</button>
  </div>

  <div id="controls">
    <button id="startPauseBtn" class="ctrl-btn">시작</button>
    <button id="resetBtn" class="ctrl-btn">리셋</button>
    <button id="skipBtn" class="ctrl-btn">건너뛰기</button>
    <button id="fullscreenBtn" class="ctrl-btn">전체화면</button>
    <button id="musicToggleBtn" class="ctrl-btn">♪ 음악</button>
    <button id="statsBtn" class="ctrl-btn">통계</button>
    <button id="focusBtn" class="ctrl-btn">집중 측정</button>
  </div>

  <div id="hint">Space 시작/정지 · R 리셋 · ⌘+Enter 전체화면 · 1-4 시간 선택 · 5 직접 입력 · 6 스톱워치 · N 건너뛰기 · S 통계 · M 음악 · P 재생/일시정지 · ,/. 곡 이동 · B 화면 끄기 · F 집중 측정</div>

  <div id="customDim"></div>
  <div id="customPanel">
    <h3>집중 시간 직접 설정</h3>
    <div class="row">
      <input id="customMinutes" type="number" min="1" max="300" placeholder="분 (예: 40)">
      <button id="customConfirmBtn" class="ctrl-btn" style="opacity:1;">확인</button>
    </div>
    <div id="customHint">숫자만 입력 · Enter 확인 · ESC 취소</div>
  </div>

  <div id="blackout"></div>

  <div id="focusDim"></div>
  <div id="focusPanel">
    <button id="focusCloseBtn" class="ctrl-btn">✕</button>
    <div id="focusBody"></div>
  </div>

  <div id="statsDim"></div>
  <div id="statsPanel">
    <button id="statsCloseBtn" class="ctrl-btn">✕</button>
    <h3>최근 7일</h3>
    <div id="statsWeekChart"></div>
    <div id="statsWeekTotal"></div>
    <h3>최근 30일</h3>
    <div id="statsHeatmap"></div>
    <div id="statsDayDetail"></div>

    <h3>기기 동기화</h3>
    <div id="syncSection">
      <div class="row" id="syncConnectRow">
        <input id="syncTokenInput" type="password" placeholder="GitHub 토큰 붙여넣기">
        <button id="syncConnectBtn" class="ctrl-btn" style="opacity:1;">연결</button>
      </div>
      <div id="syncStatusRow" style="display:none;">
        <span id="syncStatusText"></span>
        <button id="syncDisconnectBtn" class="ctrl-btn">해제</button>
      </div>
    </div>
  </div>

</div>

<script>
(function () {
  "use strict";

  // ---------- Constants ----------
  var TICK_MS = 250;
  var PRESET_KEY = "studyTimer_preset";
  var DAY_RESET_HOUR = 2; // "오늘 공부시간"은 매일 새벽 2시에 리셋

  // focus-duration presets: focus minutes only. break/longBreak are computed dynamically
  // from actual elapsed focus time (see startBreakFromFocus).
  var PRESETS = {
    "25":  { focus: 25 },
    "50":  { focus: 50 },
    "80":  { focus: 80 },
    "100": { focus: 100 }
  };

  // ---------- State ----------
  var currentPresetKey = "25"; // overwritten from localStorage during init()
  var mode = "focus";          // 'focus' | 'break' | 'longBreak'
  var running = false;
  var endTime = null;          // Date.now() timestamp when current session ends
  var remainingMs = PRESETS[currentPresetKey].focus * 60 * 1000; // used while paused / not started
  var lastTickTime = null;     // last time we accounted focus study time
  var accumFocusMin = 0;       // 마지막 긴 휴식 이후 누적 실제 집중 분 (in-memory, 새로고침 시 0으로 리셋됨)
  var currentBreakMs = null;   // 현재/다음 휴식 세션 길이 (startBreakFromFocus에서 설정, durationForMode가 참조)
  var intervalId = null;
  var overtimeNotified = false; // 이번 집중 세션에서 "목표 시간 완료" 알림을 이미 보냈는지
  var swElapsedMs = 0;          // 스톱워치 모드: 일시정지 구간까지 누적된 경과 시간
  var swSegmentStart = null;    // 스톱워치 모드: 현재 재생 구간이 시작된 시각 (일시정지 중엔 null)

  // ---------- DOM ----------
  var timerEl = document.getElementById("timer");
  var modeLabelEl = document.getElementById("modeLabel");
  var studyTimeEl = document.getElementById("studyTime");
  var startPauseBtn = document.getElementById("startPauseBtn");
  var resetBtn = document.getElementById("resetBtn");
  var skipBtn = document.getElementById("skipBtn");
  var fullscreenBtn = document.getElementById("fullscreenBtn");
  var musicToggleBtn = document.getElementById("musicToggleBtn");
  var musicPanel = document.getElementById("musicPanel");
  var musicUrlInput = document.getElementById("musicUrl");
  var musicLoadBtn = document.getElementById("musicLoad");
  var musicError = document.getElementById("musicError");
  var musicPlayPauseBtn = document.getElementById("musicPlayPauseBtn");
  var musicNextBtn = document.getElementById("musicNextBtn");
  var musicTrackTitle = document.getElementById("musicTrackTitle");
  var presetBtns = Array.prototype.slice.call(document.querySelectorAll(".preset-btn"));
  var customDim = document.getElementById("customDim");
  var customPanel = document.getElementById("customPanel");
  var customMinutesInput = document.getElementById("customMinutes");
  var customConfirmBtn = document.getElementById("customConfirmBtn");
  var customPresetBtn = document.getElementById("customPresetBtn");
  var statsBtn = document.getElementById("statsBtn");
  var statsDim = document.getElementById("statsDim");
  var statsPanel = document.getElementById("statsPanel");
  var statsCloseBtn = document.getElementById("statsCloseBtn");
  var statsWeekChart = document.getElementById("statsWeekChart");
  var statsWeekTotal = document.getElementById("statsWeekTotal");
  var statsHeatmap = document.getElementById("statsHeatmap");
  var syncTokenInput = document.getElementById("syncTokenInput");
  var syncConnectBtn = document.getElementById("syncConnectBtn");
  var syncConnectRow = document.getElementById("syncConnectRow");
  var syncStatusRow = document.getElementById("syncStatusRow");
  var syncStatusText = document.getElementById("syncStatusText");
  var syncDisconnectBtn = document.getElementById("syncDisconnectBtn");

  // ---------- Helpers ----------
  function currentPreset() {
    return PRESETS[currentPresetKey] || PRESETS["25"];
  }

    var body = {

    if (sha) body.sha = sha;

      Object.keys(remoteMine).forEach(function (k) { allKeys[k] = true; });

      Object.keys(allKeys).forEach(function (k) {

        var remoteVal = remoteMine[k] || 0;
        var maxVal = Math.max(localVal, remoteVal);
        merged[k] = maxVal;
        if (maxVal !== localVal) {

      var otherDevices = {};
      Object.keys(remoteData.devices).forEach(function (devId) {

      });

    // 센서만 계속 돌아, 쉬는 시간이 집중 세션에 그대로 쌓인다.

  function tick() {
    if (!running) return;
    var now = Date.now();
    if (mode === "focus" && lastTickTime) {
      addStudyTime(now - lastTickTime);
    }
    lastTickTime = now;

    if (isStopwatchMode() && mode === "focus") {
      updateDisplay();
      return;
    }

    var remaining = endTime - now;

    if (mode === "focus") {
      // 카운트다운이 0에 도달해도 세션을 넘기지 않는다: 계속 집중 상태를 유지하고
      // 화면에는 "+MM:SS" 초과 시간을 보여준다. 알림은 세션당 1회만.
      if (remaining <= 0 && !overtimeNotified) {
        overtimeNotified = true;
        notifyOvertime();
      }
      updateDisplay();
      return;
    }

    // break / longBreak: 0에 도달하면 자동으로 집중을 시작하지 않고 대기 상태로.
    if (remaining <= 0) {
      goToFocusWaiting(true);
      return;
    }
    updateDisplay();
  }

  // ---------- Keyboard shortcuts ----------
  document.addEventListener("keydown", function (e) {
    var target = e.target;
    var isTyping = target && (target.tagName === "INPUT" || target.tagName === "TEXTAREA" || target.isContentEditable);
    if (isTyping) return;

    var mod = e.metaKey || e.ctrlKey;

    // modifier combos first
    if (e.key === "Enter" && mod) {
      e.preventDefault();
      toggleFullscreen();
      return;

    if (e.code === "F8" && mod) {
      e.preventDefault();
      toggleMusicPlayback();
      return;

    // don't hijack other cmd/ctrl shortcuts (cmd+R reload 등)
    if (mod) return;

    // e.code 기준 판정: 한글 입력 상태에서도 물리 키 위치로 동작

      e.preventDefault();
      toggleFocusPanel();
      return;
    }
    if (e.code === "Space") {
      e.preventDefault();
      togglePause();
    } else if (e.code === "KeyR") {

    } else if (e.code === "Digit1" || e.code === "Numpad1") {

    } else if (e.code === "Digit2" || e.code === "Numpad2") {

    } else if (e.code === "Digit4" || e.code === "Numpad4") {
      e.preventDefault();
      selectPreset("100");
    } else if (e.code === "Digit5" || e.code === "Numpad5") {

    } else if (e.code === "Digit6" || e.code === "Numpad6") {

    var weekTotal = weekData.reduce(function (sum, w) { return sum + w.ms; }, 0);

    // 30-day heatmap (oldest -> newest)

      var hd = dateForDayOffset(j);

      var lvl = 0;

      var cell = document.createElement("div");
      cell.className = "stats-heat-cell" + (lvl > 0 ? " lvl" + lvl : "");
      cell.title = (hd.getMonth() + 1) + "월 " + hd.getDate() + "일 · " + formatStudyTime(hms);
      cell.dataset.detail = cell.title;
      statsHeatmap.appendChild(cell);

  // ---------- Music (YouTube IFrame Player API) ----------
  var MUSIC_URL_KEY = "studyTimer_lastYoutubeUrl";
  var DEFAULT_PLAYLIST_URL = "https://youtube.com/playlist?list=PLVx_Hd6b1shjuDCz05SZr_n_auFBpRIcn";

  // parses a youtube URL into { videoId, listId } (either may be null, but not both)
  function parseYoutubeUrl(rawUrl) {
    var url;
    try {
      url = new URL(rawUrl.trim());
    } catch (e) {
      return null;
    }
    var host = url.hostname.replace(/^www\./, "");
    var validHosts = ["youtube.com", "m.youtube.com", "music.youtube.com", "youtu.be"];
    if (validHosts.indexOf(host) === -1) return null;

    var videoId = null;
    var listId = url.searchParams.get("list"); // si= and other params are simply ignored

    if (host === "youtu.be") {
      videoId = url.pathname.replace(/^\//, "").split("/")[0] || null;
    } else {
      videoId = url.searchParams.get("v");
      if (!videoId) {
        // support /embed/VIDEOID or /shorts/VIDEOID paths
        var m = url.pathname.match(/\/(embed|shorts)\/([^/?]+)/);
        if (m) videoId = m[2];
      }
      // /playlist?list=... paths have no video id; listId above already captures it
    }

    if (!videoId && !listId) return null;
    return { videoId: videoId || null, listId: listId || null };
  }

  // ---------- YouTube IFrame Player API (loaded lazily on first use) ----------
  var ytApiLoading = false;
  var ytApiCallbacks = [];
  var player = null;
  var playerReady = false;
  var playerReadyCallbacks = [];
  var pendingShuffleForListId = null; // set right after loadPlaylist to arm the shuffle-once pattern
  var hasLoadedOnce = false;

  function loadYouTubeIframeApiIfNeeded(cb) {
    if (window.YT && window.YT.Player) {
      cb();
      return;
    }
    ytApiCallbacks.push(cb);
    if (ytApiLoading) return;
    ytApiLoading = true;
    var previousReady = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = function () {
      if (typeof previousReady === "function") {
        try { previousReady(); } catch (e) {}
      }
      var callbacks = ytApiCallbacks;
      ytApiCallbacks = [];
      callbacks.forEach(function (fn) { fn(); });
    };
    var tag = document.createElement("script");
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);
  }

  function withPlayer(cb) {
    if (playerReady && player) {
      cb(player);
      return;
    }
    playerReadyCallbacks.push(cb);
    if (player) return; // creation already kicked off, just wait
    loadYouTubeIframeApiIfNeeded(function () {
      player = new YT.Player("musicFrame", {
        width: "320",
        height: "180",
        playerVars: { autoplay: 0, playsinline: 1, rel: 0 },
        events: {
          onReady: function () {
            playerReady = true;
            var callbacks = playerReadyCallbacks;
            playerReadyCallbacks = [];
            callbacks.forEach(function (fn) { fn(player); });
          },
          onStateChange: onPlayerStateChange,
          onError: function () {
            musicError.textContent = "재생 오류가 발생했어요";
          }
        }
      });
    });
  }

  function onPlayerStateChange(e) {
    updatePlayPauseIcon(e.data);
    updateTrackTitle();

    // robust shuffle pattern: setShuffle right after loadPlaylist frequently doesn't
    // take effect, so wait for the first CUED/PLAYING state after loading, then shuffle
    // and jump to a random track.
    if (pendingShuffleForListId && (e.data === YT.PlayerState.CUED || e.data === YT.PlayerState.PLAYING)) {
      pendingShuffleForListId = null;
      try {
        player.setShuffle(true);
        var pl = player.getPlaylist();
        var idx = (pl && pl.length) ? Math.floor(Math.random() * pl.length) : 0;
        player.playVideoAt(idx);
      } catch (err) {
        // ignore
      }
    }
  }

  function updatePlayPauseIcon(state) {
    var s = state;
    if (typeof s !== "number") {
      s = (player && player.getPlayerState) ? player.getPlayerState() : -1;
    }
    musicPlayPauseBtn.textContent = (s === YT.PlayerState.PLAYING) ? "⏸" : "▶";
  }

  function updateTrackTitle() {
    try {
      var data = (player && player.getVideoData) ? player.getVideoData() : null;
      var title = (data && data.title) ? data.title : "";
      musicTrackTitle.textContent = title;
      musicTrackTitle.title = title;
    } catch (e) {
      musicTrackTitle.textContent = "";
    }
  }

  function loadMusic(rawUrl) {
    musicError.textContent = "";
    var parsed = parseYoutubeUrl(rawUrl);
    if (!parsed) {
      musicError.textContent = "올바른 유튜브 링크가 아니에요";
      return;
    }
    localStorage.setItem(MUSIC_URL_KEY, rawUrl.trim());
    hasLoadedOnce = true;
    withPlayer(function (p) {
      musicTrackTitle.textContent = "";
      if (parsed.listId) {
        // loadPlaylist 는 큐만 잡는 cuePlaylist 와 달리 바로 재생을 시작한다.
        pendingShuffleForListId = parsed.listId;
        p.loadPlaylist({ listType: "playlist", list: parsed.listId, index: 0, suggestedQuality: "small" });
      } else if (parsed.videoId) {
        pendingShuffleForListId = null;
        p.loadVideoById(parsed.videoId);
      }
    });
  }

  musicLoadBtn.addEventListener("click", function (e) {
    loadMusic(musicUrlInput.value);
    if (e.target && e.target.blur) e.target.blur();
  });
  musicUrlInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {

  musicToggleBtn.addEventListener("click", function (e) {

  });

  function toggleMusicPlayback() {
    if (!hasLoadedOnce) {
      // nothing loaded into the player yet: load current input and let it play
      loadMusic(musicUrlInput.value);
    } else {
      withPlayer(function (p) {
        var state = p.getPlayerState ? p.getPlayerState() : -1;
        if (state === YT.PlayerState.PLAYING) {
          p.pauseVideo();
        } else {
          p.playVideo();
        }
      });
    }
  }

  musicPlayPauseBtn.addEventListener("click", function (e) {
    toggleMusicPlayback();
    if (e.target && e.target.blur) e.target.blur();
  });

  musicNextBtn.addEventListener("click", function (e) {

        if (p.nextVideo) p.nextVideo();

    if (e.target && e.target.blur) e.target.blur();
  });

  // ---------- Init ----------
  function init() {

    var storedCustom = parseInt(localStorage.getItem(CUSTOM_KEY) || "", 10);
    if (storedCustom >= 1 && storedCustom <= 300) {

  // ══════════════════════════════════════════════════════════════════
  // 집중 측정 (FocusSensor 연동)
  //
  // 타이머가 주인이고 센서는 그 밑에 붙는 모듈이다. 센서가 죽어도 타이머는
  // 평소대로 동작해야 하므로 모든 진입점을 try/catch 로 감싼다.
  // 센서 스크립트는 사용자가 측정을 켤 때 처음 내려받는다 (지연 로딩).
  // ══════════════════════════════════════════════════════════════════
  var FOCUS_ENABLED_KEY = "studyTimer_focusEnabled";
  var focusEnabled = false;      // 사용자가 측정을 켰는가
  var focusReady = false;        // 센서 초기화(카메라·모델)까지 끝났는가
  var focusCal = null;           // 저장된 캘리브레이션
  var focusLastSession = null;   // 마지막으로 끝낸 세션 (리포트용)
  var focusChecks = {};          // 진단 체크포인트 상태
  var focusCalibrating = false;
  var focusLoading = false;

  var focusDim = document.getElementById("focusDim");
  var focusPanel = document.getElementById("focusPanel");
  var focusBody = document.getElementById("focusBody");
  var focusBtn = document.getElementById("focusBtn");
  var focusChip = document.getElementById("focusChip");
  var focusChipText = document.getElementById("focusChipText");
  var focusCloseBtn = document.getElementById("focusCloseBtn");

  function FS() { return window.FocusSensor; }

  // 배포할 때마다 올린다. sw.js CACHE_NAME 과 같은 번호.
  // 쿼리를 붙이는 이유: 서비스워커는 페이지 앞단 프록시라 강제 새로고침(⌥⌘R)으로도
  // 못 건너뛴다. 옛 서비스워커가 옛 focus-sensor.js 를 계속 내주는 상황이 반복됐다.
  // 캐시에 없는 주소로 요청하면 옛 서비스워커도 네트워크로 나갈 수밖에 없다.
  var SENSOR_V = "26";

  function loadSensor() {
    if (window.FocusSensor) return Promise.resolve(true);
    if (focusLoading) return focusLoading;
    focusLoading = new Promise(function (res) {
      var el = document.createElement("script");
      el.src = "focus-sensor.js?v=" + SENSOR_V;
      el.onload = function () { res(!!window.FocusSensor); };
      el.onerror = function () { res(false); };
      document.head.appendChild(el);
    });
    return focusLoading;
  }

  // 타이머 상태가 바뀔 때마다 호출된다 (start/pause/reset/휴식 전환).
  // 센서는 "측정 켬 + 돌아가는 중 + 집중 모드" 일 때만 관측한다.
  function focusOnTimerChange() {
    try {
      if (!focusEnabled || !focusReady || !FS()) return;
      var want = running && mode === "focus";
      if (want && !FS().running) {
        FS().start(focusCal, null, onFocusTick);
      } else if (want && FS().paused) {
        FS().resume();
      } else if (!want && FS().running && !FS().paused) {
        FS().pause("break");   // 휴식·일시정지는 집중률 분모에서 빠진다
      }
      updateFocusChip();
    } catch (err) {
      console.warn("[집중 측정] 상태 전환 실패", err);
    }
  }

  var focusChipLast = -1e9;
  function onFocusTick(sess, states) {
    if (sess.count - focusChipLast < 10) return;   // 1초에 한 번
    focusChipLast = sess.count;
    updateFocusChip(sess, states);
  }

  function updateFocusChip(sess, states) {
    try {
      if (!focusEnabled) { focusChip.classList.remove("on"); return; }
      focusChip.classList.add("on");
      var fs = FS();
      if (!focusReady) { focusChipText.textContent = "측정 준비 안 됨"; focusChip.firstElementChild.style.background = "#5a5a64"; return; }
      if (!fs || !fs.running) { focusChipText.textContent = "대기"; focusChip.firstElementChild.style.background = "#5a5a64"; return; }
      if (fs.paused) { focusChipText.textContent = "휴식"; focusChip.firstElementChild.style.background = fs.COLOR[5]; return; }
      var h = fs.health;
      if (document.hidden && h.bgActive) { /* 가려진 채로도 측정 중 — 칩은 어차피 안 보인다 */ }
      if (!h.ok || h.wakeLost) {
        focusChipText.textContent = h.ok ? "화면 꺼짐 방지 풀림" : h.reason;
        focusChip.firstElementChild.style.background = fs.COLOR[2];
        return;
      }
      var s = sess || fs.session, st = states || fs.states;
      if (!s || !s.count) { focusChipText.textContent = "측정 중"; return; }
      var cur = st[s.count - 1];
      var r = fs.stats(st.subarray(0, s.count));
      focusChipText.textContent = fs.STATE[cur] + " · " + (r.rate * 100).toFixed(0) + "%";
      focusChip.firstElementChild.style.background = fs.COLOR[cur];
    } catch (err) { /* 칩은 장식이라 실패해도 무시 */ }
  }

  function focusCk(key, status, msg) {
    focusChecks[key] = { status: status, msg: msg };
    var row = document.getElementById("fck_" + key);
    if (row) {
      row.className = "fck " + (status || "");
      row.querySelector(".m").textContent = msg || "";
    }
  }

  function calAgeText(c) {
    var days = Math.round((Date.now() - c.at) / 86400000);
    return new Date(c.at).toLocaleString("ko-KR") + (days ? " · " + days + "일 전" : "");
  }

  function renderFocusPanel() {
    var fs = FS();
    var html = '<h3>집중 측정</h3>' +
      '<div class="fdim">얼굴 지표만 저장하고 영상은 즉시 폐기합니다. ' +
      '타이머가 집중 모드로 돌아가는 동안에만 관측하고, 휴식·일시정지 구간은 집중률 분모에서 빠집니다.</div>';

    if (!fs) {
      html += '<div class="frow"><button class="fbtn pri" id="fEnable">측정 켜기</button></div>' +
        '<div class="fdim">처음 켤 때 센서 모듈(약 40KB)과 얼굴 인식 모델(3.6MB)을 내려받고 카메라 권한을 묻습니다.</div>';
      focusBody.innerHTML = html;
      bindFocusPanel();
      return;
    }

    // 진단 체크포인트. 센서 버전을 함께 찍는다 — 캐시된 옛 코드가 도는지
    // 화면만 보고 알 수 없어 같은 혼란을 여러 번 겪었다.
    html += '<h4>초기화 <span class="fdim" style="font-weight:400">· 센서 ' +
      (fs.VERSION || '(구버전 — 새로고침 필요)') + '</span></h4><div>';
    for (var i = 0; i < fs.CHECKS.length; i++) {
      var k = fs.CHECKS[i][0], lbl = fs.CHECKS[i][1];
      var c = focusChecks[k] || { status: "", msg: "대기" };
      html += '<div class="fck ' + (c.status || "") + '" id="fck_' + k + '">' +
        '<span class="d"></span><span class="n">' + lbl + '</span>' +
        '<span class="m">' + (c.msg || "") + '</span></div>';
    }
    html += '</div>';

    if (!focusReady) {
      html += '<div class="fwarn">빨간 점이 찍힌 단계가 실패 지점입니다. 그 줄의 메시지를 그대로 읽으세요. ' +
        'https 또는 localhost 가 아니면 카메라 권한 창 자체가 뜨지 않습니다.</div>' +
        '<div class="frow"><button class="fbtn pri" id="fEnable">다시 시도</button>' +
        '<button class="fbtn" id="fBeep">알림 미리듣기</button></div>';
      focusBody.innerHTML = html;
      bindFocusPanel();
      return;
    }

    // 캘리브레이션
    html += '<h4>캘리브레이션</h4>';
    if (focusCal) {
      html += '<div class="fdim">저장됨 · ' + calAgeText(focusCal) + '<br>' +
        'earOpen ' + focusCal.earOpen.toFixed(3) + ' / earClosed ' + focusCal.earClosed.toFixed(3) +
        ' / 분리도 ' + focusCal.sep.toFixed(3) + ' / 판정선 ' + focusCal.earThr.toFixed(3) +
        ' / faceH ' + focusCal.faceH.toFixed(2) + '</div>';
      if (focusCal.warn) html += '<div class="fwarn">' + focusCal.warn + '</div>';
    } else {
      html += '<div class="fdim">아직 없습니다. 65초짜리 캘리브레이션을 한 번 해야 측정을 시작할 수 있습니다. ' +
        'A단계 45초는 <b>실제로 문제를 푸는 자세</b>로 하세요 — 그 자세가 집중의 기준선이 됩니다.</div>';
    }
    html += '<div class="frow">' +
      '<button class="fbtn ' + (focusCal ? '' : 'pri') + '" id="fCal">' +
      (focusCal ? '다시 측정 (65초)' : '캘리브레이션 시작 (65초)') + '</button>' +
      '<button class="fbtn" id="fBeep">알림 미리듣기</button>' +
      '<label class="fdim" style="display:flex;gap:6px;align-items:center">' +
      '<input type="checkbox" id="fAlerts"' + (fs.options.alerts ? ' checked' : '') + '> 졸음 알림</label>' +
      '<label class="fdim" style="display:flex;gap:6px;align-items:center">' +
      '<input type="checkbox" id="fBt"> 블루투스 연결 유지</label>' +
      '<label class="fdim" style="display:flex;gap:6px;align-items:center">' +
      '<input type="checkbox" id="fBg"' + (fs.options.bgMode ? ' checked' : '') + '> 가려져도 계속 측정</label>' +
      '<label class="fdim" style="display:flex;gap:6px;align-items:center">' +
      '<input type="checkbox" id="fAway"' + (fs.options.awayOnTurn ? ' checked' : '') + '> 고개 돌림을 이탈로 셈</label>' +
      '</div>' +
      '<div class="fdim" style="font-size:11px">가려진 탭은 브라우저가 타이머를 분당 1회로 조입니다. ' +
      '이 옵션은 오디오 스레드를 클럭으로 써서 그 제한을 우회합니다(실측 11.7Hz). ' +
      '대신 거의 안 들리는 60Hz 소리를 계속 흘리므로 Safari 탭에 스피커 표시가 뜨고 배터리를 조금 더 씁니다. ' +
      '끄면 가려진 동안은 “측정 불가”로 남습니다.</div>' +
      '<div class="frow" style="margin-top:4px">' +
      '<label class="fdim" style="display:flex;gap:6px;align-items:center">' +
      '<input type="checkbox" id="fShots"' + (fs.options.shots ? ' checked' : '') + '> 졸음 순간 썸네일 저장</label>' +
      '<button class="fbtn" id="fClearShots">저장된 썸네일 지우기</button>' +
      '<span class="fdim" id="fShotsMsg"></span></div>' +
      '<div class="fdim" style="font-size:11px">128×96 크기로 졸음 판정이 선 순간에만, 세션당 최대 150장 남깁니다. ' +
      '오판(필기 자세를 졸음으로 찍은 것 등)을 눈으로 걸러내야 임계값을 고칠 근거가 생기기 때문입니다. ' +
      '이 맥의 IndexedDB 에만 저장되고 서버로 전송되지 않습니다. 끄면 리포트의 썸네일 칸이 비게 됩니다.</div>';

    // 측정 상태
    html += '<h4>측정</h4>';
    if (!focusEnabled) {
      html += '<div class="fdim">꺼져 있습니다.</div>' +
        '<div class="frow"><button class="fbtn pri" id="fOn"' + (focusCal ? '' : ' disabled') + '>측정 켜기</button></div>';
    } else {
      var s = fs.session;
      var state = !fs.running ? "대기 — 타이머 집중을 시작하면 관측을 시작합니다"
        : fs.paused ? "휴식 중 — 카메라 정지됨"
        : "관측 중 · " + fs.hms((s ? s.count : 0) / fs.HZ);
      // 백그라운드 클럭이 실제로 돌고 있는지. 이게 꺼져 있으면 가려지는 순간 측정이 끊긴다.
      if (fs.running) {
        state += fs.health.bgActive
          ? ' · <span style="color:#4fa87a">가려져도 측정 켜짐</span>'
          : ' · <span style="color:#d4573a">가려지면 측정 중단</span>';
      }
      html += '<div class="fdim">' + state + '</div>' +
        '<div class="frow"><button class="fbtn" id="fOff">측정 끄고 리포트 보기</button></div>';
    }

    html += '<div id="fReport"></div>';
    focusBody.innerHTML = html;
    bindFocusPanel();
    if (focusLastSession) fs.report(focusLastSession, document.getElementById("fReport"));
  }

  function bindFocusPanel() {
    var g = function (id) { return document.getElementById(id); };
    if (g("fEnable")) g("fEnable").onclick = enableFocus;
    if (g("fBeep")) g("fBeep").onclick = function () { try { FS().sound.alert(); } catch (e) {} };
    if (g("fCal")) g("fCal").onclick = runCalibration;
    if (g("fOn")) g("fOn").onclick = function () {
      focusEnabled = true;
      try { localStorage.setItem(FOCUS_ENABLED_KEY, "1"); } catch (e) {}
      focusOnTimerChange(); updateFocusChip(); renderFocusPanel();
    };
    if (g("fOff")) g("fOff").onclick = async function () {
      focusEnabled = false;
      try { localStorage.setItem(FOCUS_ENABLED_KEY, "0"); } catch (e) {}
      try { if (FS() && FS().running) focusLastSession = await FS().stop(); } catch (e) { console.warn(e); }
      updateFocusChip(); renderFocusPanel();
    };
    if (g("fAlerts")) g("fAlerts").onchange = function (e) { FS().setOptions({ alerts: e.target.checked }); };
    if (g("fBt")) g("fBt").onchange = function (e) { try { FS().sound.setKeepAlive(e.target.checked); } catch (err) {} };
    if (g("fShots")) g("fShots").onchange = function (e) { FS().setOptions({ shots: e.target.checked }); };
    if (g("fAway")) g("fAway").onchange = function (e) { FS().setOptions({ awayOnTurn: e.target.checked }); };
    if (g("fBg")) g("fBg").onchange = function (e) {
      FS().setOptions({ bgMode: e.target.checked });
      // 세션이 이미 돌고 있으면 다음 세션부터 적용된다는 걸 알려준다
      if (FS().running) g("fBg").parentElement.insertAdjacentHTML("afterend",
        '<span class="fdim" style="font-size:11px">— 다음 측정부터 적용</span>');
    };
    if (g("fClearShots")) g("fClearShots").onclick = async function () {
      var msg = g("fShotsMsg");
      try {
        var n = await FS().clearShots();
        if (focusLastSession && focusLastSession.shots) focusLastSession.shots = [];
        if (msg) msg.textContent = n + "장 삭제됨";
        renderFocusPanel();
        if (document.getElementById("fShotsMsg")) document.getElementById("fShotsMsg").textContent = n + "장 삭제됨";
      } catch (err) { if (msg) msg.textContent = "삭제 실패"; }
    };
  }

  async function enableFocus() {
    var btn = document.getElementById("fEnable");
    if (btn) { btn.disabled = true; btn.textContent = "초기화 중…"; }
    var loaded = await loadSensor();
    if (!loaded) {
      focusBody.innerHTML = '<h3>집중 측정</h3><div class="fwarn">focus-sensor.js 를 불러오지 못했습니다. ' +
        '파일이 같은 폴더에 있는지 확인하세요.</div>';
      return;
    }
    try { FS().sound.init(); } catch (e) {}   // AudioContext 는 사용자 제스처에서 생성
    renderFocusPanel();
    focusReady = await FS().init(focusCk);
    if (focusReady) {
      var saved = await FS().loadCal();
      if (saved) focusCal = saved;
    }
    renderFocusPanel();
  }

  async function runCalibration() {
    if (focusCalibrating) return;
    focusCalibrating = true;
    focusBody.innerHTML = '<h3>캘리브레이션</h3>' +
      '<div class="fstage" id="fcStage">A단계 · 1/3</div>' +
      '<div class="finstr" id="fcInstr">—</div>' +
      '<div class="fdim" id="fcHint"></div>' +
      '<div class="fcnt" id="fcCnt">0</div>' +
      '<div class="fbar"><i id="fcBar"></i></div>' +
      '<div class="frow"><span class="fdim">얼굴 인식 <b id="fcOk">—</b> · EAR <b id="fcEar">—</b> · faceH <b id="fcFh">—</b></span></div>' +
      '<div class="frow"><button class="fbtn" id="fcAbort">중단</button></div>';
    document.getElementById("fcAbort").onclick = function () { FS().abortCalibration(); };

    var r = await FS().calibrate(function (p) {
      var g = function (id) { return document.getElementById(id); };
      if (!g("fcStage")) return;
      g("fcStage").textContent = p.key + "단계 · " + (p.stage + 1) + "/3";
      g("fcInstr").textContent = p.instr;
      g("fcHint").textContent = p.hint;
      g("fcCnt").textContent = Math.ceil(p.left);
      g("fcBar").style.width = (p.frac * 100) + "%";
      g("fcOk").textContent = (p.okRate * 100).toFixed(0) + "%";
      g("fcEar").textContent = p.m ? p.m.ear.toFixed(3) : "—";
      g("fcFh").textContent = p.m ? p.m.faceH.toFixed(2) : "—";
    });
    focusCalibrating = false;
    var saveFailed = false;
    if (r.cal) {
      focusCal = r.cal;
      // 저장이 실패해도 이번 세션은 메모리 값으로 돌아간다. 다만 조용히 넘어가면
      // 다음에 열었을 때 "다시 측정하라"는 말만 보게 되므로 실패를 화면에 남긴다.
      saveFailed = !(await FS().saveCal(focusCal));
    }
    renderFocusPanel();
    if (r.error) {
      focusBody.insertAdjacentHTML("afterbegin", '<div class="fwarn">' + r.error + '</div>');
    } else if (saveFailed) {
      focusBody.insertAdjacentHTML("afterbegin", '<div class="fwarn">캘리브레이션은 잘 됐지만 ' +
        '저장에 실패했습니다. 이번 세션은 그대로 쓸 수 있지만 창을 닫으면 사라집니다. ' +
        '(브라우저 저장소가 막혀 있거나 용량이 꽉 찬 경우)</div>');
    }
  }

  function openFocusPanel() {
    focusDim.classList.add("open");
    focusPanel.classList.add("open");
    renderFocusPanel();
  }
  function closeFocusPanel() {
    focusDim.classList.remove("open");
    focusPanel.classList.remove("open");
  }
  function toggleFocusPanel() {
    if (focusPanel.classList.contains("open")) closeFocusPanel(); else openFocusPanel();
  }

  focusBtn.addEventListener("click", function (e) {
    toggleFocusPanel();
    if (e.target && e.target.blur) e.target.blur();
  });
  focusCloseBtn.addEventListener("click", closeFocusPanel);
  focusDim.addEventListener("click", closeFocusPanel);

  // 창을 닫기 전에 마지막 스냅샷을 남긴다 (1분 주기 스냅샷의 빈틈 메우기).
  // stop() 을 부르면 안 된다 — BFCache 로 되살아나는 경우 타이머는 계속 도는데
  // 센서만 죽은 채로 돌아온다. 저장만 하고 센서는 살려 둔다.
  window.addEventListener("pagehide", function () {
    try { if (FS() && FS().running) FS().snapshot(); } catch (e) {}
  });
  // BFCache 복귀. 이때 타이머 상태와 센서 상태가 어긋나 있을 수 있으므로 다시 맞춘다.
  window.addEventListener("pageshow", function (e) {
    if (!e.persisted) return;
    try { focusOnTimerChange(); updateFocusChip(); } catch (err) {}
  });

  init();
})();
</script>
</body>
</html>
