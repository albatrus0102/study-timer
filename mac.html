</head>

<script>
(function () {
  "use strict";

  // ---------- Constants ----------
  var TICK_MS = 250;
  var PRESET_KEY = "studyTimer_preset";
  // "오늘 공부시간"의 하루 경계. 새벽 2시로 두면 2시 넘겨 공부한 게 다음 날로 넘어가
  // 하룻밤 공부가 둘로 쪼개진다. 5시면 그런 일이 거의 없다.
  // 주의: 이미 저장된 기록은 그때의 경계로 들어가 있어 소급 적용되지 않는다.
  var DAY_RESET_HOUR = 5;
  var SESSION_KEY = "studyTimer_session"; // iOS가 PWA를 통째로 죽여도(화면 잠금·앱 전환) 이어서 복원하기 위한 스냅샷
  var SESSION_MAX_GAP_MS = 4 * 60 * 60 * 1000; // 이보다 오래 떠나 있었으면 이어받지 않고 초기 상태로
  var SESSION_SAVE_THROTTLE_MS = 5000; // tick()마다 저장하면 낭비라 스로틀

  // focus-duration presets: focus minutes only. break/longBreak are computed dynamically
  // from actual elapsed focus time (see startBreakFromFocus).
  var PRESETS = {
    "25":  { focus: 25 },
    "50":  { focus: 50 },
    "80":  { focus: 80 },
    "100": { focus: 100 }
  };

  // ---------- State ----------
  var currentPresetKey = "25"; // overwritten from localStorage during init()
  var mode = "focus";          // 'focus' | 'break' | 'longBreak'
  var running = false;
  var endTime = null;          // Date.now() timestamp when current session ends
  var remainingMs = PRESETS[currentPresetKey].focus * 60 * 1000; // used while paused / not started
  var lastTickTime = null;     // last time we accounted focus study time
  var accumFocusMin = 0;       // 마지막 긴 휴식 이후 누적 실제 집중 분 (in-memory, 새로고침 시 0으로 리셋됨)
  var currentBreakMs = null;   // 현재/다음 휴식 세션 길이 (startBreakFromFocus에서 설정, durationForMode가 참조)
  var intervalId = null;
  var overtimeNotified = false; // 이번 집중 세션에서 "목표 시간 완료" 알림을 이미 보냈는지
  var swElapsedMs = 0;          // 스톱워치 모드: 일시정지 구간까지 누적된 경과 시간
  var swSegmentStart = null;    // 스톱워치 모드: 현재 재생 구간이 시작된 시각 (일시정지 중엔 null)
  var lastSessionSaveAt = 0;    // saveSession() 스로틀용 마지막 저장 시각

  // ---------- DOM ----------
  var timerEl = document.getElementById("timer");
  var modeLabelEl = document.getElementById("modeLabel");
  var studyTimeEl = document.getElementById("studyTime");
  var startPauseBtn = document.getElementById("startPauseBtn");
  var resetBtn = document.getElementById("resetBtn");
  var skipBtn = document.getElementById("skipBtn");
  var fullscreenBtn = document.getElementById("fullscreenBtn");
  var musicToggleBtn = document.getElementById("musicToggleBtn");
  var musicPanel = document.getElementById("musicPanel");
  var musicUrlInput = document.getElementById("musicUrl");
  var musicLoadBtn = document.getElementById("musicLoad");
  var musicError = document.getElementById("musicError");
  var musicPlayPauseBtn = document.getElementById("musicPlayPauseBtn");
  var musicNextBtn = document.getElementById("musicNextBtn");
  var musicTrackTitle = document.getElementById("musicTrackTitle");
  var presetBtns = Array.prototype.slice.call(document.querySelectorAll(".preset-btn"));
  var customDim = document.getElementById("customDim");
  var customPanel = document.getElementById("customPanel");
  var customMinutesInput = document.getElementById("customMinutes");
  var customConfirmBtn = document.getElementById("customConfirmBtn");
  var customPresetBtn = document.getElementById("customPresetBtn");
  var statsBtn = document.getElementById("statsBtn");
  var statsDim = document.getElementById("statsDim");
  var statsPanel = document.getElementById("statsPanel");
  var statsCloseBtn = document.getElementById("statsCloseBtn");
  var statsWeekChart = document.getElementById("statsWeekChart");
  var statsWeekTotal = document.getElementById("statsWeekTotal");
  var statsHeatmap = document.getElementById("statsHeatmap");
  var syncTokenInput = document.getElementById("syncTokenInput");
  var syncConnectBtn = document.getElementById("syncConnectBtn");
  var syncConnectRow = document.getElementById("syncConnectRow");
  var syncStatusRow = document.getElementById("syncStatusRow");
  var syncStatusText = document.getElementById("syncStatusText");
  var syncDisconnectBtn = document.getElementById("syncDisconnectBtn");

  // ---------- Helpers ----------
  function currentPreset() {
    return PRESETS[currentPresetKey] || PRESETS["25"];
  }

  function isStopwatchMode() {
    return currentPresetKey === "stopwatch";
  }

  function durationForMode(m) {
    if (m === "focus") return currentPreset().focus * 60 * 1000;
    if (currentBreakMs != null) return currentBreakMs;
    return (m === "longBreak") ? 15 * 60 * 1000 : 3 * 60 * 1000; // 안전 기본값
  }

  function formatClock(ms) {
    var totalSec = Math.max(0, Math.ceil(ms / 1000));
    var min = Math.floor(totalSec / 60);
    var sec = totalSec % 60;
    return (min < 10 ? "0" + min : min) + ":" + (sec < 10 ? "0" + sec : sec);
  }

  function formatStopwatch(ms) {
    var totalSec = Math.max(0, Math.floor(ms / 1000));
    var h = Math.floor(totalSec / 3600);
    var m = Math.floor((totalSec % 3600) / 60);
    var s = totalSec % 60;
    var mm = (m < 10 ? "0" + m : String(m));
    var ss = (s < 10 ? "0" + s : String(s));
    return h > 0 ? (h + ":" + mm + ":" + ss) : (mm + ":" + ss);
  }

  // 현재 재생 구간까지 포함한, 지금 이 순간의 실제 집중 경과 시간(ms).
  // 스톱워치 모드에선 누적치 그대로, 카운트다운 모드에선 (설정 시간 - 남은 시간)으로
  // 계산하므로 초과(overtime) 상태에서는 자연스럽게 설정 시간보다 커진다.
  function focusElapsedMs(now) {
    if (isStopwatchMode()) {
      return swElapsedMs + ((running && swSegmentStart) ? (now - swSegmentStart) : 0);
    }
    var duration = durationForMode("focus");
    var remaining = running ? (endTime - now) : remainingMs;
    return Math.max(0, duration - remaining);
  }

  // 집중 모드에서 카운트다운이 0을 지나 초과(overtime) 상태로 들어갔는지.
  // 스톱워치 모드에는 초과 개념이 없다.
  function isOvertime() {
    if (isStopwatchMode()) return false;
    if (mode !== "focus" || !running || endTime == null) return false;
    return (endTime - Date.now()) <= 0;
  }

  // 하루의 경계를 새벽 2시로 옮긴다: 00:00~01:59 는 아직 "어제"로 계산.
  function dateForDayOffset(daysAgo) {
    return new Date(Date.now() - DAY_RESET_HOUR * 60 * 60 * 1000 - (daysAgo || 0) * 24 * 60 * 60 * 1000);
  }

  function dayKeyFromDate(d) {
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + day;
  }

  function dayKeyForOffset(daysAgo) {
    return dayKeyFromDate(dateForDayOffset(daysAgo));
  }

  function todayKey() {
    return dayKeyForOffset(0);
  }

  function dayKeyForTimestamp(ts) {
    return dayKeyFromDate(new Date(ts - DAY_RESET_HOUR * 60 * 60 * 1000));
  }

  function getStoredStudyMs() {
    return totalStudyMsForKey(todayKey());
  }

  // ---- 배터리 최적화: 공부시간을 매 tick마다 디스크에 쓰지 않고 모았다 쓴다 ----
  var STUDY_FLUSH_MS = 5000;
  var pendingStudyMs = 0;
  var lastStudyFlushAt = 0;

  // tick 전용: 메모리에만 쌓고, 5초에 한 번만 실제 저장한다.
  function accrueStudyTime(deltaMs) {
    if (deltaMs <= 0) return;
    pendingStudyMs += deltaMs;
    var now = Date.now();
    if (now - lastStudyFlushAt >= STUDY_FLUSH_MS) flushStudyTime();
  }

  // 쌓아둔 시간을 즉시 저장한다 (세션 전환·일시정지·앱 종료 직전 등).
  function flushStudyTime() {
    lastStudyFlushAt = Date.now();
    if (pendingStudyMs <= 0) return;
    var d = pendingStudyMs;
    pendingStudyMs = 0;
    addStudyTime(d);
  }

  function addStudyTime(deltaMs) {
    if (deltaMs <= 0) return;
    var key = "studyTime_" + todayKey();
    var current = parseInt(localStorage.getItem(key) || "0", 10) || 0;
    var updated = current + deltaMs;
    localStorage.setItem(key, String(updated));
    renderStudyTime(totalStudyMsForKey(todayKey()));
  }

  function formatStudyTime(ms) {
    var totalMin = Math.floor(ms / 60000);
    var hours = Math.floor(totalMin / 60);
    var minutes = totalMin % 60;
    if (hours > 0) {
      return hours + "시간 " + minutes + "분";
    }
    return minutes + "분";
  }

  function renderStudyTime(ms) {
    studyTimeEl.textContent = "오늘: " + formatStudyTime(ms);
  }

  function modeLabelText(m) {
    if (m === "focus") return isOvertime() ? "초과" : "집중";
    return "휴식";
  }

  var lastRenderedClock = null, lastRenderedLabel = null;
  function updateDisplay() {
    var clock, label;
    if (isStopwatchMode() && mode === "focus") {
      var elapsed = swElapsedMs + ((running && swSegmentStart) ? (Date.now() - swSegmentStart) : 0);
      clock = formatStopwatch(elapsed);
      label = "집중";
    } else if (isOvertime()) {
      var overtimeMs = Date.now() - endTime;
      clock = "+" + formatClock(overtimeMs);
      label = "초과";
    } else {
      var msToShow = running ? Math.max(0, endTime - Date.now()) : remainingMs;
      clock = formatClock(msToShow);
      label = modeLabelText(mode);
    }
    // 화면 글자가 실제로 바뀔 때만 다시 그린다 (탭 제목 갱신은 특히 비싸다)
    if (clock !== lastRenderedClock || label !== lastRenderedLabel) {
      lastRenderedClock = clock;
      lastRenderedLabel = label;
      timerEl.textContent = clock;
      modeLabelEl.textContent = label;
      document.title = clock + " · " + label;
    }
    startPauseBtn.textContent = isOvertime() ? "휴식 시작" : (running ? "정지" : "시작");
  }

  // ---------- GitHub Sync ----------
  var GITHUB_OWNER = "albatrus0102";
  var GITHUB_REPO = "study-stats";
  var GITHUB_PATH = "stats.json";
  var GITHUB_BRANCH = "main";
  var GITHUB_API_URL = "https://api.github.com/repos/" + GITHUB_OWNER + "/" + GITHUB_REPO + "/contents/" + GITHUB_PATH;
  var TOKEN_KEY = "studyTimer_ghToken";
  var REMOTE_DEVICES_KEY = "studyTimer_remoteDevices";
  // 기기 식별자. 세 버전(맥/아이패드/아이폰)이 같은 주소를 쓰기 때문에, 한 기기 안에서는
  // localStorage 가 공유된다 — 그래서 여기에 한 번 정해두면 어느 버전을 열든 같은 칸에
  // 기록된다. (예전처럼 페이지마다 이름을 박아두면 같은 공부 시간이 mac/phone 두 칸에
  // 중복으로 올라간다.) 처음 실행하는 버전의 기본 이름을 그 기기의 이름으로 굳힌다.
  var DEVICE_ID = (function () {
    var FALLBACK = "mac";
    try {
      var k = "studyTimer_deviceId";
      var v = localStorage.getItem(k);
      if (!v) { v = FALLBACK; localStorage.setItem(k, v); }
      return v;
    } catch (e) {
      return FALLBACK;
    }
  })();
  var SYNC_MIN_INTERVAL_MS = 60 * 1000;
  var SYNC_KEEP_DAYS = 60;

  var syncInProgress = false;
  var lastSyncAt = null;    // Date.now() of last successful sync
  var lastSyncError = null; // string | null

  function getGithubToken() {
    return localStorage.getItem(TOKEN_KEY) || "";
  }

  function setGithubToken(token) {
    if (token) localStorage.setItem(TOKEN_KEY, token);
    else localStorage.removeItem(TOKEN_KEY);
  }

  // btoa/atob only handle latin1, so route through encodeURIComponent for unicode safety.
  function b64EncodeUnicode(str) {
    return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, function (match, p1) {
      return String.fromCharCode("0x" + p1);
    }));
  }

  function b64DecodeUnicode(str) {
    return decodeURIComponent(atob(str).split("").map(function (c) {
      return "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2);
    }).join(""));
  }

  function getRemoteDevicesCache() {
    try {
      var raw = localStorage.getItem(REMOTE_DEVICES_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) {
      return {};
    }
  }

  function setRemoteDevicesCache(devices) {
    try {
      localStorage.setItem(REMOTE_DEVICES_KEY, JSON.stringify(devices));
    } catch (e) {
      // ignore storage errors silently
    }
  }

  // 내 localStorage + 다른 기기들의 원격 캐시(remoteDevices)를 합산한, 특정 날짜의 총 공부 시간(ms).
  // remoteDevices에는 내 deviceId 섹션을 저장하지 않으므로 이중 계산 걱정 없음.
  function totalStudyMsForKey(key) {
    var total = parseInt(localStorage.getItem("studyTime_" + key) || "0", 10) || 0;
    total += extTotalMsForKey(key);   // 열품타 등에서 직접 넣은 시간
    var remoteDevices = getRemoteDevicesCache();
    Object.keys(remoteDevices).forEach(function (devId) {
      if (devId === DEVICE_ID) return;
      var devData = remoteDevices[devId];
      if (devData && typeof devData[key] === "number") {
        total += devData[key];
      }
    });
    return total;
  }

  function getAllLocalStudyEntries() {
    var entries = {};
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k && k.indexOf("studyTime_") === 0) {
        var dateKey = k.slice("studyTime_".length);
        entries[dateKey] = parseInt(localStorage.getItem(k) || "0", 10) || 0;
      }
    }
    return entries;
  }

  // 과목별 일간 합계 { "2026-08-29": { "국어": 6300000 } }.
  // 바탕화면 위젯이 stats.json 을 읽어 과목별로 보여주려면 이게 올라가야 한다.
  function getAllLocalExtEntries() {
    var out = {};
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (!k || k.indexOf(EXT_PREFIX) !== 0) continue;
      var dateKey = k.slice(EXT_PREFIX.length);
      var per = {};
      extEntriesForKey(dateKey).forEach(function (e) {
        var n = extNameOf(e);
        if (e.ms > 0) per[n] = (per[n] || 0) + e.ms;
      });
      if (Object.keys(per).length) out[dateKey] = per;
    }
    return out;
  }

  // dayKey가 "YYYY-MM-DD" 형식(0-padded)이라 문자열 비교가 곧 날짜 비교와 같다.
  function trimToRecentDays(dataObj, days) {
    var cutoffKey = dayKeyForOffset(days - 1);
    var result = {};
    Object.keys(dataObj).forEach(function (dateKey) {
      if (dateKey >= cutoffKey) result[dateKey] = dataObj[dateKey];
    });
    return result;
  }

  function fetchRemoteStats(token) {
    return fetch(GITHUB_API_URL + "?ref=" + GITHUB_BRANCH, {
      headers: {
        "Authorization": "Bearer " + token,
        "Accept": "application/vnd.github+json"
      }
    }).then(function (res) {
      if (res.status === 404) {
        return { data: { devices: {} }, sha: null };
      }
      if (!res.ok) {
        var err = new Error("GitHub GET failed: " + res.status);
        err.status = res.status;
        throw err;
      }
      return res.json().then(function (json) {
        var data;
        try {
          data = JSON.parse(b64DecodeUnicode((json.content || "").replace(/\n/g, "")));
        } catch (e) {
          data = { devices: {} };
        }
        if (!data.devices) data.devices = {};
        return { data: data, sha: json.sha };
      });
    });
  }

  function putRemoteStats(token, data, sha) {
    var body = {
      message: "sync " + DEVICE_ID,
      content: b64EncodeUnicode(JSON.stringify(data)),
      branch: GITHUB_BRANCH
    };
    if (sha) body.sha = sha;
    return fetch(GITHUB_API_URL, {
      method: "PUT",
      headers: {
        "Authorization": "Bearer " + token,
        "Accept": "application/vnd.github+json",
        "Content-Type": "application/json"
      },
      body: JSON.stringify(body)
    }).then(function (res) {
      if (!res.ok) {
        var err = new Error("GitHub PUT failed: " + res.status);
        err.status = res.status;
        throw err;
      }
      return res.json();
    });
  }

  function describeSyncError(err) {
    if (err && err.status === 401) return "토큰이 유효하지 않아요";
    if (err && err.status) return "동기화 오류 (" + err.status + ")";
    return "동기화 오류";
  }

  // 로컬(내 deviceId)과 원격의 날짜별 값을 max로 병합하고, 변경이 있으면 PUT으로 반영한다.
  // isRetry: sha 충돌(409/422) 시 한 번만 재시도하기 위한 플래그.
  function doSyncAttempt(token, isRetry) {
    fetchRemoteStats(token).then(function (remote) {
      var remoteData = remote.data;
      if (!remoteData.devices) remoteData.devices = {};

      var localEntries = getAllLocalStudyEntries();
      var remoteMine = remoteData.devices[DEVICE_ID] || {};

      var allKeys = {};
      Object.keys(localEntries).forEach(function (k) { allKeys[k] = true; });
      Object.keys(remoteMine).forEach(function (k) { allKeys[k] = true; });

      var merged = {};
      var changed = false;
      Object.keys(allKeys).forEach(function (k) {
        var localVal = localEntries[k] || 0;
        var remoteVal = remoteMine[k] || 0;
        // 기본은 max 병합이다 — 같은 기기를 다른 브라우저에서 열거나 저장소가 비워졌을 때
        // 기록이 사라지지 않게 하려는 것이다. 다만 사용자가 직접 고친 날은 줄어들어야
        // 하므로(타이머를 실수로 켜둔 경우 등) 그 날은 로컬이 이긴다.
        var fixed = !!localStorage.getItem(STUDY_FIX_PREFIX + k);
        var maxVal = fixed ? localVal : Math.max(localVal, remoteVal);
        merged[k] = maxVal;
        if (maxVal !== localVal) {
          localStorage.setItem("studyTime_" + k, String(maxVal));
          changed = true;
        }
        if (maxVal !== remoteVal) changed = true;
      });

      var trimmed = trimToRecentDays(merged, SYNC_KEEP_DAYS);
      if (Object.keys(trimmed).length !== Object.keys(remoteMine).length) changed = true;

      // 과목별 기록. 총량과 달리 max 병합을 쓰지 않는다 — 항목을 지우면 줄어야 하는데
      // max 로는 절대 안 줄어든다. 이 기기가 자기 칸의 주인이므로 그대로 덮어쓴다.
      if (!remoteData.subjects) remoteData.subjects = {};
      var extLocal = trimToRecentDays(getAllLocalExtEntries(), SYNC_KEEP_DAYS);
      var extRemote = remoteData.subjects[DEVICE_ID] || {};
      if (JSON.stringify(extLocal) !== JSON.stringify(extRemote)) changed = true;

      // cache other devices' sections for totalStudyMsForKey() / stats display
      var otherDevices = {};
      Object.keys(remoteData.devices).forEach(function (devId) {
        if (devId !== DEVICE_ID) otherDevices[devId] = remoteData.devices[devId];
      });
      setRemoteDevicesCache(otherDevices);

      renderStudyTime(totalStudyMsForKey(todayKey()));

      if (!changed) {
        lastSyncAt = Date.now();
        lastSyncError = null;
        syncInProgress = false;
        renderSyncUI();
        return;
      }

      remoteData.devices[DEVICE_ID] = trimmed;
      remoteData.subjects[DEVICE_ID] = extLocal;

      putRemoteStats(token, remoteData, remote.sha).then(function () {
        lastSyncAt = Date.now();
        lastSyncError = null;
        syncInProgress = false;
        renderSyncUI();
      }).catch(function (err) {
        if (!isRetry && err && (err.status === 409 || err.status === 422)) {
          doSyncAttempt(token, true);
          return;
        }
        lastSyncError = describeSyncError(err);
        syncInProgress = false;
        renderSyncUI();
      });
    }).catch(function (err) {
      lastSyncError = describeSyncError(err);
      syncInProgress = false;
      renderSyncUI();
    });
  }

  // immediate: 60초 스로틀을 건너뛴다 (세션 전환·토큰 연결 직후 등).
  function syncStats(immediate) {
    var token = getGithubToken();
    if (!token) return;
    if (syncInProgress) return;
    var now = Date.now();
    if (!immediate && lastSyncAt && (now - lastSyncAt) < SYNC_MIN_INTERVAL_MS) return;
    syncInProgress = true;
    doSyncAttempt(token, false);
  }

  function formatHHMM(ts) {
    var d = new Date(ts);
    var h = String(d.getHours()).padStart(2, "0");
    var m = String(d.getMinutes()).padStart(2, "0");
    return h + ":" + m;
  }

  function renderSyncUI() {
    var token = getGithubToken();
    if (!token) {
      syncConnectRow.style.display = "flex";
      syncStatusRow.style.display = "none";
      return;
    }
    syncConnectRow.style.display = "none";
    syncStatusRow.style.display = "flex";
    if (lastSyncError) {
      syncStatusText.textContent = lastSyncError;
    } else if (lastSyncAt) {
      syncStatusText.textContent = "동기화 켜짐 · 마지막: " + formatHHMM(lastSyncAt);
    } else {
      syncStatusText.textContent = "동기화 켜짐 · 동기화 중...";
    }
  }

  syncConnectBtn.addEventListener("click", function (e) {
    var token = syncTokenInput.value.trim();
    if (token) {
      setGithubToken(token);
      syncTokenInput.value = "";
      lastSyncError = null;
      lastSyncAt = null;
      renderSyncUI();
      syncStats(true);
    }
    if (e.target && e.target.blur) e.target.blur();
  });

  syncTokenInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      syncConnectBtn.click();
    } else if (e.key === "Escape") {
      e.preventDefault();
    }
    e.stopPropagation();
  });

  syncDisconnectBtn.addEventListener("click", function (e) {
    setGithubToken(null);
    lastSyncAt = null;
    lastSyncError = null;
    renderSyncUI();
    if (e.target && e.target.blur) e.target.blur();
  });

  // triggers: 5분마다(온라인일 때) + 화면 복귀 시
  setInterval(function () {
    if (navigator.onLine) syncStats(false);
  }, 5 * 60 * 1000);

  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") syncStats(false);
  });

  // ---------- Notifications ----------
  var NOTIFICATION_TAG = "study-timer-session";
  var notificationPermissionRequested = false;

  function requestNotificationPermissionOnce() {
    if (notificationPermissionRequested) return;
    notificationPermissionRequested = true;
    try {
      if (typeof Notification === "undefined") return;
      if (Notification.permission === "default") {
        Notification.requestPermission();
      }
    } catch (e) {
      // ignore unsupported browsers
    }
  }

  // 집중 카운트다운이 0에 도달해 초과(overtime) 상태로 들어가는 순간, 세션당 1회
  function notifyOvertime() {
    try {
      if (typeof Notification === "undefined") return;
      if (Notification.permission !== "granted") return;
      new Notification("목표 시간 완료! 쉴 준비되면 탭", { tag: NOTIFICATION_TAG });
    } catch (e) {
      // ignore notification errors silently
    }
  }

  // 휴식 카운트다운이 0에 도달해 대기 상태로 들어가는 순간
  function notifyBreakOver() {
    try {
      if (typeof Notification === "undefined") return;
      if (Notification.permission !== "granted") return;
      new Notification("휴식 끝! 탭해서 집중 시작", { tag: NOTIFICATION_TAG });
    } catch (e) {
      // ignore notification errors silently
    }
  }

  // ---------- Music auto pause/resume around sessions ----------
  var musicPausedByApp = false;

  function pauseMusicForBreak() {
    if (!player || !playerReady) return;
    try {
      var state = player.getPlayerState ? player.getPlayerState() : -1;
      if (state === YT.PlayerState.PLAYING) {
        player.pauseVideo();
        musicPausedByApp = true;
      }
    } catch (e) {
      // ignore player errors silently
    }
  }

  function resumeMusicForFocus() {
    if (!musicPausedByApp) return;
    musicPausedByApp = false;
    if (!player || !playerReady) return;
    try {
      player.playVideo();
    } catch (e) {
      // ignore player errors silently
    }
  }

  // ---------- Timer control ----------
  function start() {
    if (running) return;
    requestNotificationPermissionOnce();
    running = true;
    // 스톱워치 카운트업은 집중 세션에만 해당 — 스톱워치발 휴식은 일반 카운트다운
    if (isStopwatchMode() && mode === "focus") {
      swSegmentStart = Date.now();
    } else {
      endTime = Date.now() + remainingMs;
    }
    lastTickTime = Date.now();
    if (!intervalId) intervalId = setInterval(tick, TICK_MS);
    // 휴식이 끝나고 대기하던 사용자가 집중을 다시 시작하는 이 시점에 음악을 재개한다.
    resumeMusicForFocus();
    updateDisplay();
    focusOnTimerChange();
    saveSession();
  }

  function pause() {
    if (!running) return;
    var now = Date.now();
    // account any elapsed focus time up to this moment
    if (mode === "focus" && lastTickTime) {
      accrueStudyTime(now - lastTickTime); flushStudyTime();
    }
    if (isStopwatchMode() && mode === "focus") {
      // 정지해도 경과 시간은 그대로 유지한다(일시정지). 실수로 화면을 스쳤을 때
      // 블록이 사라지지 않도록 — 블록 마감(00:00)은 '건너뛰기'로만 한다.
      swElapsedMs = swElapsedMs + (swSegmentStart ? (now - swSegmentStart) : 0);
      swSegmentStart = null;
    } else {
      remainingMs = Math.max(0, endTime - now);
    }
    running = false;
    updateDisplay();
    focusOnTimerChange();
    saveSession();
  }

  // 카운트다운 중(초과 전)에는 일시정지/재개. 초과(overtime) 상태에서는
  // 일시정지 대신 곧바로 휴식을 시작한다 (설계상 초과 상태에서 멈춘 채로 대기하는 상태는 없음).
  function togglePause() {
    if (running) {
      if (isOvertime()) {
        startBreakFromFocus(true);
      } else {
        pause();
      }
    } else {
      start();
    }
  }

  function reset() {
    running = false;
    overtimeNotified = false;
    if (isStopwatchMode() && mode === "focus") {
      swElapsedMs = 0;
      swSegmentStart = null;
      remainingMs = 0;
    } else {
      remainingMs = durationForMode(mode);
    }
    endTime = null;
    lastTickTime = null;
    updateDisplay();
    focusOnTimerChange();
    saveSession();
  }

  // 집중 → 휴식으로 전환한다. 실제 집중 경과 시간(focusElapsedMs, 초과분 포함)을 기준으로
  // 휴식/긴휴식 길이와 누적 집중 분을 계산한다 (기존 알고리즘 그대로).
  // keepRunning: 전환 직후 휴식을 바로 카운트다운 시작할지 (일시정지 중 건너뛰기라면 false).
  function startBreakFromFocus(keepRunning) {
    var now = Date.now();
    if (running && mode === "focus" && lastTickTime) {
      accrueStudyTime(now - lastTickTime); flushStudyTime();
    }

    var elapsedMs = focusElapsedMs(now);
    var elapsedMin = Math.round(elapsedMs / 60000);
    var total = accumFocusMin + elapsedMin;

    if (total >= 150) {
      mode = "longBreak";
      currentBreakMs = 15 * 60 * 1000;
      accumFocusMin = 0;
    } else {
      mode = "break";
      var restMin = Math.max(3, Math.min(5, Math.round(elapsedMin * 0.07)));
      // 휴식이 공부한 시간보다 길 수는 없다 (짧은 세션·테스트 대비, 최소 1분)
      if (elapsedMin < restMin) restMin = Math.max(1, elapsedMin);
      currentBreakMs = restMin * 60 * 1000;
      accumFocusMin = total;
    }

    remainingMs = durationForMode(mode);
    overtimeNotified = false;

    // 휴식이 실제로 시작되는 이 시점에 음악을 일시정지한다.
    pauseMusicForBreak();

    running = keepRunning;
    if (running) {
      endTime = Date.now() + remainingMs;
      lastTickTime = Date.now();
    } else {
      endTime = null;
      lastTickTime = null;
    }
    updateDisplay();
    focusOnTimerChange();
    syncStats(true);
    saveSession();
  }

  // 휴식 → 집중 대기 상태로 전환한다. 자동으로 집중을 시작하지 않고 탭/시작 버튼을 기다린다.
  function goToFocusWaiting(notify) {
    mode = "focus";
    running = false;
    overtimeNotified = false;
    if (isStopwatchMode()) {
      swElapsedMs = 0;
      swSegmentStart = null;
      remainingMs = 0;
    } else {
      remainingMs = durationForMode("focus");
    }
    endTime = null;
    lastTickTime = null;
    if (notify) notifyBreakOver();
    updateDisplay();
    focusOnTimerChange();
    syncStats(true);
    saveSession();
  }

  function skip() {
    if (mode === "focus") {
      // 돌아가는 중이면 계속 진행, 멈춰 있으면 멈춘 채로 휴식 준비
      startBreakFromFocus(running);
    } else {
      // 휴식을 수동으로 건너뛴 건 명시적 행동이므로 바로 집중 시작
      goToFocusWaiting(false);
      start();
    }
  }

  // ---------- Focus-duration presets ----------
  function updatePresetButtonsUI() {
    presetBtns.forEach(function (btn) {
      btn.classList.toggle("active", btn.getAttribute("data-preset") === currentPresetKey);
    });
  }

  function selectPreset(key) {
    if (!PRESETS[key] && key !== "stopwatch") return;
    currentPresetKey = key;
    localStorage.setItem(PRESET_KEY, key);

    // reset current session to the new focus duration; keep tomato count & study time intact
    running = false;
    mode = "focus";
    overtimeNotified = false;
    if (isStopwatchMode()) {
      swElapsedMs = 0;
      swSegmentStart = null;
      remainingMs = 0;
    } else {
      remainingMs = durationForMode(mode);
    }
    endTime = null;
    lastTickTime = null;

    updatePresetButtonsUI();
    updateDisplay();
    // 프리셋 변경은 running=false 로 만든다. 훅이 없으면 타이머는 멈춘 채
    // 센서만 계속 돌아, 쉬는 시간이 집중 세션에 그대로 쌓인다.
    focusOnTimerChange();
    saveSession();
  }

  // ---------- Custom focus duration ----------
  var CUSTOM_KEY = "studyTimer_customMinutes";

  // 휴식 시간은 더 이상 프리셋에 저장하지 않는다 - 실제 집중 시간 기반으로 startBreakFromFocus에서 계산.
  function buildCustomPreset(min) {
    return { focus: min };
  }

  function applyCustomMinutes(min) {
    PRESETS["custom"] = buildCustomPreset(min);
    customPresetBtn.textContent = min + "분 (직접)";
  }

  function openCustomInput() {
    var stored = parseInt(localStorage.getItem(CUSTOM_KEY) || "", 10);
    customMinutesInput.value = stored > 0 ? String(stored) : "";
    customDim.classList.add("open");
    customPanel.classList.add("open");
    customMinutesInput.focus();
    customMinutesInput.select();
  }

  function closeCustomInput() {
    customDim.classList.remove("open");
    customPanel.classList.remove("open");
    customMinutesInput.blur();
  }

  function confirmCustomInput() {
    var min = parseInt(customMinutesInput.value, 10);
    if (!min || min < 1 || min > 300) {
      customMinutesInput.value = "";
      customMinutesInput.placeholder = "1~300 사이 숫자";
      return;
    }
    localStorage.setItem(CUSTOM_KEY, String(min));
    applyCustomMinutes(min);
    closeCustomInput();
    selectPreset("custom");
  }

  customConfirmBtn.addEventListener("click", confirmCustomInput);
  customDim.addEventListener("click", closeCustomInput);
  customMinutesInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      confirmCustomInput();
    } else if (e.key === "Escape") {
      e.preventDefault();
      closeCustomInput();
    }
    e.stopPropagation();
  });

  function tick() {
    if (!running) return;
    var now = Date.now();
    if (mode === "focus" && lastTickTime) {
      accrueStudyTime(now - lastTickTime);
    }
    lastTickTime = now;

    if (now - lastSessionSaveAt >= SESSION_SAVE_THROTTLE_MS) {
      lastSessionSaveAt = now;
      saveSession();
    }

    if (isStopwatchMode() && mode === "focus") {
      updateDisplay();
      return;
    }

    var remaining = endTime - now;

    if (mode === "focus") {
      // 카운트다운이 0에 도달해도 세션을 넘기지 않는다: 계속 집중 상태를 유지하고
      // 화면에는 "+MM:SS" 초과 시간을 보여준다. 알림은 세션당 1회만.
      if (remaining <= 0 && !overtimeNotified) {
        overtimeNotified = true;
        notifyOvertime();
      }
      updateDisplay();
      return;
    }

    // break / longBreak: 0에 도달하면 자동으로 집중을 시작하지 않고 대기 상태로.
    if (remaining <= 0) {
      goToFocusWaiting(true);
      return;
    }
    updateDisplay();
  }

  // ══════════════════════════════════════════════════════════════════
  // 세션 상태 저장·복원
  //
  // iOS는 PWA를 백그라운드로 보내면(화면 잠금·앱 전환) 몇 초~몇 분 안에 탭을
  // 통째로 죽인다. 메모리 상태(mode/running/endTime/...)가 전부 날아가므로
  // localStorage에 스냅샷을 남겨 두고, 다시 열릴 때(init) 이어서 복원한다.
  // ══════════════════════════════════════════════════════════════════
  function saveSession() {
    try {
      var now = Date.now();
      var swElapsedNow = swElapsedMs;
      if (isStopwatchMode() && mode === "focus" && running && swSegmentStart) {
        swElapsedNow = swElapsedMs + (now - swSegmentStart);
      }
      var snapshot = {
        v: 1,
        presetKey: currentPresetKey,
        mode: mode,
        running: running,
        endTime: endTime,
        remainingMs: remainingMs,
        accumFocusMin: accumFocusMin,
        currentBreakMs: currentBreakMs,
        overtimeNotified: overtimeNotified,
        swElapsedMs: swElapsedNow,
        savedAt: now
      };
      localStorage.setItem(SESSION_KEY, JSON.stringify(snapshot));
    } catch (e) {
      // ignore storage errors silently
    }
  }

  // 앱이 사라지기 직전(pagehide) 또는 가려지는 순간(hidden)에 호출.
  // 마지막 tick 이후의 공부시간을 여기서 적립해 두면, 복원 시 gap을 다시
  // 더해도 중복 계산이 되지 않는다 (savedAt까지는 이미 반영된 값이므로).
  function flushAndSave() {
    try {
      var now = Date.now();
      if (running && mode === "focus" && lastTickTime) {
        accrueStudyTime(now - lastTickTime); flushStudyTime();
        lastTickTime = now;
      }
      saveSession();
    } catch (e) {
      // ignore errors silently
    }
  }

  window.addEventListener("pagehide", flushAndSave);
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden") flushAndSave();
  });

  // init()에서, 프리셋 복원 뒤에 호출된다.
  function restoreSession() {
    try {
      var raw = localStorage.getItem(SESSION_KEY);
      if (!raw) return;
      var snap = JSON.parse(raw);
      if (!snap || snap.v !== 1) return;

      // 프리셋이 그 사이 바뀌었으면(다른 기기·다른 탭 등) 정합성이 깨지므로 무시
      if (snap.presetKey !== currentPresetKey) {
        localStorage.removeItem(SESSION_KEY);
        return;
      }

      var now = Date.now();
      var gap = Math.max(0, now - snap.savedAt);

      // 너무 오래 떠나 있었으면(밤새 방치 등) 이어받지 않는다
      if (gap > SESSION_MAX_GAP_MS) {
        localStorage.removeItem(SESSION_KEY);
        return;
      }

      mode = snap.mode;
      accumFocusMin = snap.accumFocusMin || 0;
      currentBreakMs = snap.currentBreakMs;
      overtimeNotified = !!snap.overtimeNotified;
      swElapsedMs = snap.swElapsedMs || 0;

      if (!snap.running) {
        // 멈춰 있던 그대로 복원 — 시간은 흐르지 않는다
        remainingMs = snap.remainingMs;
        running = false;
        endTime = null;
        lastTickTime = null;
        return;
      }

      // 저장 당시 돌아가고 있었다 — 그 사이 실제로 시간이 흐른 것으로 취급
      if (mode === "break" || mode === "longBreak") {
        if (snap.endTime != null && snap.endTime <= now) {
          // 떠나 있는 동안 휴식이 이미 끝났다 — 집중 대기 상태로 (알림 없음, 이미 지난 일)
          goToFocusWaiting(false);
          return;
        }
        endTime = snap.endTime;
        running = true;
        lastTickTime = now;
        if (!intervalId) intervalId = setInterval(tick, TICK_MS);
        return;
      }

      // mode === "focus"
      // savedAt까지는 flushAndSave()에서 이미 적립되어 있으므로, gap만 추가로 적립하면
      // 중복 없이 이어진다. 단, 날짜 경계(새벽 2시)를 넘겼으면 어제/오늘 어느 쪽에도
      // 애매하게 걸치므로 안전하게 생략한다.
      if (dayKeyForTimestamp(snap.savedAt) === dayKeyForTimestamp(now)) {
        addStudyTime(gap);
      }

      if (isStopwatchMode()) {
        swElapsedMs = (snap.swElapsedMs || 0) + gap;
        swSegmentStart = now;
      } else {
        endTime = snap.endTime;
      }
      running = true;
      lastTickTime = now;
      if (!intervalId) intervalId = setInterval(tick, TICK_MS);
    } catch (e) {
      // ignore corrupted session data silently
    }
  }

    var mod = e.metaKey || e.ctrlKey;

    // modifier combos first

  // ---------- Music (YouTube IFrame Player API) ----------
  var MUSIC_URL_KEY = "studyTimer_lastYoutubeUrl";
  var DEFAULT_PLAYLIST_URL = "https://youtube.com/playlist?list=PLVx_Hd6b1shjuDCz05SZr_n_auFBpRIcn";

  // parses a youtube URL into { videoId, listId } (either may be null, but not both)
  function parseYoutubeUrl(rawUrl) {
    var url;
    try {
      url = new URL(rawUrl.trim());
    } catch (e) {
      return null;
    }
    var host = url.hostname.replace(/^www\./, "");
    var validHosts = ["youtube.com", "m.youtube.com", "music.youtube.com", "youtu.be"];
    if (validHosts.indexOf(host) === -1) return null;

    var videoId = null;
    var listId = url.searchParams.get("list"); // si= and other params are simply ignored

    if (host === "youtu.be") {
      videoId = url.pathname.replace(/^\//, "").split("/")[0] || null;
    } else {
      videoId = url.searchParams.get("v");
      if (!videoId) {
        // support /embed/VIDEOID or /shorts/VIDEOID paths
        var m = url.pathname.match(/\/(embed|shorts)\/([^/?]+)/);
        if (m) videoId = m[2];
      }
      // /playlist?list=... paths have no video id; listId above already captures it
    }

    if (!videoId && !listId) return null;
    return { videoId: videoId || null, listId: listId || null };
  }

  // ---------- YouTube IFrame Player API (loaded lazily on first use) ----------
  var ytApiLoading = false;
  var ytApiCallbacks = [];
  var player = null;
  var playerReady = false;
  var playerReadyCallbacks = [];
  var pendingShuffleForListId = null; // set right after loadPlaylist to arm the shuffle-once pattern
  var hasLoadedOnce = false;

  function loadYouTubeIframeApiIfNeeded(cb) {
    if (window.YT && window.YT.Player) {
      cb();
      return;
    }
    ytApiCallbacks.push(cb);
    if (ytApiLoading) return;
    ytApiLoading = true;
    var previousReady = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = function () {
      if (typeof previousReady === "function") {
        try { previousReady(); } catch (e) {}
      }
      var callbacks = ytApiCallbacks;
      ytApiCallbacks = [];
      callbacks.forEach(function (fn) { fn(); });
    };
    var tag = document.createElement("script");
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);
  }

  function withPlayer(cb) {
    if (playerReady && player) {
      cb(player);
      return;
    }
    playerReadyCallbacks.push(cb);
    if (player) return; // creation already kicked off, just wait
    loadYouTubeIframeApiIfNeeded(function () {
      player = new YT.Player("musicFrame", {
        width: "320",
        height: "180",
        playerVars: { autoplay: 0, playsinline: 1, rel: 0 },
        events: {
          onReady: function () {
            playerReady = true;
            var callbacks = playerReadyCallbacks;
            playerReadyCallbacks = [];
            callbacks.forEach(function (fn) { fn(player); });
          },
          onStateChange: onPlayerStateChange,
          onError: function () {
            musicError.textContent = "재생 오류가 발생했어요";
          }
        }
      });
    });
  }

  function onPlayerStateChange(e) {
    updatePlayPauseIcon(e.data);
    updateTrackTitle();

    // robust shuffle pattern: setShuffle right after loadPlaylist frequently doesn't
    // take effect, so wait for the first CUED/PLAYING state after loading, then shuffle
    // and jump to a random track.
    if (pendingShuffleForListId && (e.data === YT.PlayerState.CUED || e.data === YT.PlayerState.PLAYING)) {
      pendingShuffleForListId = null;
      try {
        player.setShuffle(true);
        var pl = player.getPlaylist();
        var idx = (pl && pl.length) ? Math.floor(Math.random() * pl.length) : 0;
        player.playVideoAt(idx);
      } catch (err) {
        // ignore
      }
    }
  }

  function updatePlayPauseIcon(state) {
    var s = state;
    if (typeof s !== "number") {
      s = (player && player.getPlayerState) ? player.getPlayerState() : -1;
    }
    musicPlayPauseBtn.textContent = (s === YT.PlayerState.PLAYING) ? "⏸" : "▶";
  }

  function updateTrackTitle() {
    try {
      var data = (player && player.getVideoData) ? player.getVideoData() : null;
      var title = (data && data.title) ? data.title : "";
      musicTrackTitle.textContent = title;
      musicTrackTitle.title = title;
    } catch (e) {
      musicTrackTitle.textContent = "";
    }
  }

  function loadMusic(rawUrl) {
    musicError.textContent = "";
    var parsed = parseYoutubeUrl(rawUrl);
    if (!parsed) {
      musicError.textContent = "올바른 유튜브 링크가 아니에요";
      return;
    }
    localStorage.setItem(MUSIC_URL_KEY, rawUrl.trim());
    hasLoadedOnce = true;
    withPlayer(function (p) {
      musicTrackTitle.textContent = "";
      if (parsed.listId) {
        // loadPlaylist 는 큐만 잡는 cuePlaylist 와 달리 바로 재생을 시작한다.
        pendingShuffleForListId = parsed.listId;
        p.loadPlaylist({ listType: "playlist", list: parsed.listId, index: 0, suggestedQuality: "small" });
      } else if (parsed.videoId) {
        pendingShuffleForListId = null;
        p.loadVideoById(parsed.videoId);
      }
    });
  }

  // ══════════════════════════════════════════════════════════════════
  // 집중 측정 (FocusSensor 연동)
  //
  // 타이머가 주인이고 센서는 그 밑에 붙는 모듈이다. 센서가 죽어도 타이머는
  // 평소대로 동작해야 하므로 모든 진입점을 try/catch 로 감싼다.
  // 센서 스크립트는 사용자가 측정을 켤 때 처음 내려받는다 (지연 로딩).
  // ══════════════════════════════════════════════════════════════════
  var FOCUS_ENABLED_KEY = "studyTimer_focusEnabled";
  var focusEnabled = false;      // 사용자가 측정을 켰는가
  var focusReady = false;        // 센서 초기화(카메라·모델)까지 끝났는가
  var focusCal = null;           // 저장된 캘리브레이션
  var focusLastSession = null;   // 마지막으로 끝낸 세션 (리포트용)
  var focusChecks = {};          // 진단 체크포인트 상태
  var focusCalibrating = false;
  var focusLoading = false;

  var focusDim = document.getElementById("focusDim");
  var focusPanel = document.getElementById("focusPanel");
  var focusBody = document.getElementById("focusBody");
  var focusBtn = document.getElementById("focusBtn");
  var focusChip = document.getElementById("focusChip");
  var focusChipText = document.getElementById("focusChipText");
  var focusCloseBtn = document.getElementById("focusCloseBtn");

  function FS() { return window.FocusSensor; }

  // 배포할 때마다 올린다. sw.js CACHE_NAME 과 같은 번호.
  // 쿼리를 붙이는 이유: 서비스워커는 페이지 앞단 프록시라 강제 새로고침(⌥⌘R)으로도
  // 못 건너뛴다. 옛 서비스워커가 옛 focus-sensor.js 를 계속 내주는 상황이 반복됐다.
  // 캐시에 없는 주소로 요청하면 옛 서비스워커도 네트워크로 나갈 수밖에 없다.
  var SENSOR_V = "34";

  function loadSensor() {
    if (window.FocusSensor) return Promise.resolve(true);
    if (focusLoading) return focusLoading;
    focusLoading = new Promise(function (res) {
      var el = document.createElement("script");
      el.src = "focus-sensor.js?v=" + SENSOR_V;
      el.onload = function () { res(!!window.FocusSensor); };
      el.onerror = function () { res(false); };
      document.head.appendChild(el);
    });
    return focusLoading;
  }

  // 타이머 상태가 바뀔 때마다 호출된다 (start/pause/reset/휴식 전환).
  // 센서는 "측정 켬 + 돌아가는 중 + 집중 모드" 일 때만 관측한다.
  function focusOnTimerChange() {
    try {
      if (!focusEnabled || !focusReady || !FS()) return;
      var want = running && mode === "focus";
      if (want && !FS().running) {
        FS().start(focusCal, null, onFocusTick);
      } else if (want && FS().paused) {
        FS().resume();
      } else if (!want && FS().running && !FS().paused) {
        FS().pause("break");   // 휴식·일시정지는 집중률 분모에서 빠진다
      }
      updateFocusChip();
    } catch (err) {
      console.warn("[집중 측정] 상태 전환 실패", err);
    }
  }

  var focusChipLast = -1e9;
  function onFocusTick(sess, states) {
    if (sess.count - focusChipLast < 10) return;   // 1초에 한 번
    focusChipLast = sess.count;
    updateFocusChip(sess, states);
  }

  function updateFocusChip(sess, states) {
    try {
      if (!focusEnabled) { focusChip.classList.remove("on"); return; }
      focusChip.classList.add("on");
      var fs = FS();
      if (!focusReady) { focusChipText.textContent = "측정 준비 안 됨"; focusChip.firstElementChild.style.background = "#5a5a64"; return; }
      if (!fs || !fs.running) { focusChipText.textContent = "대기"; focusChip.firstElementChild.style.background = "#5a5a64"; return; }
      if (fs.paused) { focusChipText.textContent = "휴식"; focusChip.firstElementChild.style.background = fs.COLOR[5]; return; }
      var h = fs.health;
      if (document.hidden && h.bgActive) { /* 가려진 채로도 측정 중 — 칩은 어차피 안 보인다 */ }
      if (!h.ok || h.wakeLost) {
        focusChipText.textContent = h.ok ? "화면 꺼짐 방지 풀림" : h.reason;
        focusChip.firstElementChild.style.background = fs.COLOR[2];
        return;
      }
      var s = sess || fs.session, st = states || fs.states;
      if (!s || !s.count) { focusChipText.textContent = "측정 중"; return; }
      var cur = st[s.count - 1];
      var r = fs.stats(st.subarray(0, s.count));
      focusChipText.textContent = fs.STATE[cur] + " · " + (r.rate * 100).toFixed(0) + "%";
      focusChip.firstElementChild.style.background = fs.COLOR[cur];
    } catch (err) { /* 칩은 장식이라 실패해도 무시 */ }
  }

  function focusCk(key, status, msg) {
    focusChecks[key] = { status: status, msg: msg };
    var row = document.getElementById("fck_" + key);
    if (row) {
      row.className = "fck " + (status || "");
      row.querySelector(".m").textContent = msg || "";
    }
  }

  function calAgeText(c) {
    var days = Math.round((Date.now() - c.at) / 86400000);
    return new Date(c.at).toLocaleString("ko-KR") + (days ? " · " + days + "일 전" : "");
  }

  function renderFocusPanel() {
    var fs = FS();
    var html = '<h3>집중 측정</h3>' +
      '<div class="fdim">얼굴 지표만 저장하고 영상은 즉시 폐기합니다. ' +
      '타이머가 집중 모드로 돌아가는 동안에만 관측하고, 휴식·일시정지 구간은 집중률 분모에서 빠집니다.</div>';

    if (!fs) {
      html += '<div class="frow"><button class="fbtn pri" id="fEnable">측정 켜기</button></div>' +
        '<div class="fdim">처음 켤 때 센서 모듈(약 40KB)과 얼굴 인식 모델(3.6MB)을 내려받고 카메라 권한을 묻습니다.</div>';
      focusBody.innerHTML = html;
      bindFocusPanel();
      return;
    }

    // 진단 체크포인트. 센서 버전을 함께 찍는다 — 캐시된 옛 코드가 도는지
    // 화면만 보고 알 수 없어 같은 혼란을 여러 번 겪었다.
    html += '<h4>초기화 <span class="fdim" style="font-weight:400">· 센서 ' +
      (fs.VERSION || '(구버전 — 새로고침 필요)') + '</span></h4><div>';
    for (var i = 0; i < fs.CHECKS.length; i++) {
      var k = fs.CHECKS[i][0], lbl = fs.CHECKS[i][1];
      var c = focusChecks[k] || { status: "", msg: "대기" };
      html += '<div class="fck ' + (c.status || "") + '" id="fck_' + k + '">' +
        '<span class="d"></span><span class="n">' + lbl + '</span>' +
        '<span class="m">' + (c.msg || "") + '</span></div>';
    }
    html += '</div>';

    if (!focusReady) {
      html += '<div class="fwarn">빨간 점이 찍힌 단계가 실패 지점입니다. 그 줄의 메시지를 그대로 읽으세요. ' +
        'https 또는 localhost 가 아니면 카메라 권한 창 자체가 뜨지 않습니다.</div>' +
        '<div class="frow"><button class="fbtn pri" id="fEnable">다시 시도</button>' +
        '<button class="fbtn" id="fBeep">알림 미리듣기</button></div>';
      focusBody.innerHTML = html;
      bindFocusPanel();
      return;
    }

    // 캘리브레이션
    html += '<h4>캘리브레이션</h4>';
    if (focusCal) {
      html += '<div class="fdim">저장됨 · ' + calAgeText(focusCal) + '<br>' +
        'earOpen ' + focusCal.earOpen.toFixed(3) + ' / earClosed ' + focusCal.earClosed.toFixed(3) +
        ' / 분리도 ' + focusCal.sep.toFixed(3) + ' / 판정선 ' + focusCal.earThr.toFixed(3) +
        ' / faceH ' + focusCal.faceH.toFixed(2) + '</div>';
      if (focusCal.warn) html += '<div class="fwarn">' + focusCal.warn + '</div>';
    } else {
      html += '<div class="fdim">아직 없습니다. 65초짜리 캘리브레이션을 한 번 해야 측정을 시작할 수 있습니다. ' +
        'A단계 45초는 <b>실제로 문제를 푸는 자세</b>로 하세요 — 그 자세가 집중의 기준선이 됩니다.</div>';
    }
    html += '<div class="frow">' +
      '<button class="fbtn ' + (focusCal ? '' : 'pri') + '" id="fCal">' +
      (focusCal ? '다시 측정 (65초)' : '캘리브레이션 시작 (65초)') + '</button>' +
      '<button class="fbtn" id="fBeep">알림 미리듣기</button>' +
      '<label class="fdim" style="display:flex;gap:6px;align-items:center">' +
      '<input type="checkbox" id="fAlerts"' + (fs.options.alerts ? ' checked' : '') + '> 졸음 알림</label>' +
      '<label class="fdim" style="display:flex;gap:6px;align-items:center">' +
      '<input type="checkbox" id="fBt"> 블루투스 연결 유지</label>' +
      '<label class="fdim" style="display:flex;gap:6px;align-items:center">' +
      '<input type="checkbox" id="fBg"' + (fs.options.bgMode ? ' checked' : '') + '> 가려져도 계속 측정</label>' +
      '<label class="fdim" style="display:flex;gap:6px;align-items:center">' +
      '<input type="checkbox" id="fAway"' + (fs.options.awayOnTurn ? ' checked' : '') + '> 고개 돌림을 이탈로 셈</label>' +
      '</div>' +
      '<div class="fdim" style="font-size:11px">가려진 탭은 브라우저가 타이머를 분당 1회로 조입니다. ' +
      '이 옵션은 오디오 스레드를 클럭으로 써서 그 제한을 우회합니다(실측 11.7Hz). ' +
      '대신 거의 안 들리는 60Hz 소리를 계속 흘리므로 Safari 탭에 스피커 표시가 뜨고 배터리를 조금 더 씁니다. ' +
      '끄면 가려진 동안은 “측정 불가”로 남습니다.</div>' +
      '<div class="frow" style="margin-top:4px">' +
      '<label class="fdim" style="display:flex;gap:6px;align-items:center">' +
      '<input type="checkbox" id="fShots"' + (fs.options.shots ? ' checked' : '') + '> 졸음 순간 썸네일 저장</label>' +
      '<button class="fbtn" id="fClearShots">저장된 썸네일 지우기</button>' +
      '<span class="fdim" id="fShotsMsg"></span></div>' +
      '<div class="fdim" style="font-size:11px">128×96 크기로 졸음 판정이 선 순간에만, 세션당 최대 150장 남깁니다. ' +
      '오판(필기 자세를 졸음으로 찍은 것 등)을 눈으로 걸러내야 임계값을 고칠 근거가 생기기 때문입니다. ' +
      '이 맥의 IndexedDB 에만 저장되고 서버로 전송되지 않습니다. 끄면 리포트의 썸네일 칸이 비게 됩니다.</div>';

    // 측정 상태
    html += '<h4>측정</h4>';
    if (!focusEnabled) {
      html += '<div class="fdim">꺼져 있습니다.</div>' +
        '<div class="frow"><button class="fbtn pri" id="fOn"' + (focusCal ? '' : ' disabled') + '>측정 켜기</button></div>';
    } else {
      var s = fs.session;
      var state = !fs.running ? "대기 — 타이머 집중을 시작하면 관측을 시작합니다"
        : fs.paused ? "휴식 중 — 카메라 정지됨"
        : "관측 중 · " + fs.hms((s ? s.count : 0) / fs.HZ);
      // 백그라운드 클럭이 실제로 돌고 있는지. 이게 꺼져 있으면 가려지는 순간 측정이 끊긴다.
      if (fs.running) {
        state += fs.health.bgActive
          ? ' · <span style="color:#4fa87a">가려져도 측정 켜짐</span>'
          : ' · <span style="color:#d4573a">가려지면 측정 중단</span>';
      }
      html += '<div class="fdim">' + state + '</div>' +
        '<div class="frow"><button class="fbtn" id="fOff">측정 끄고 리포트 보기</button></div>';
    }

    html += '<div id="fReport"></div>';
    focusBody.innerHTML = html;
    bindFocusPanel();
    if (focusLastSession) fs.report(focusLastSession, document.getElementById("fReport"));
  }

  function bindFocusPanel() {
    var g = function (id) { return document.getElementById(id); };
    if (g("fEnable")) g("fEnable").onclick = enableFocus;
    if (g("fBeep")) g("fBeep").onclick = function () { try { FS().sound.alert(); } catch (e) {} };
    if (g("fCal")) g("fCal").onclick = runCalibration;
    if (g("fOn")) g("fOn").onclick = function () {
      focusEnabled = true;
      try { localStorage.setItem(FOCUS_ENABLED_KEY, "1"); } catch (e) {}
      focusOnTimerChange(); updateFocusChip(); renderFocusPanel();
    };
    if (g("fOff")) g("fOff").onclick = async function () {
      focusEnabled = false;
      try { localStorage.setItem(FOCUS_ENABLED_KEY, "0"); } catch (e) {}
      try { if (FS() && FS().running) focusLastSession = await FS().stop(); } catch (e) { console.warn(e); }
      updateFocusChip(); renderFocusPanel();
    };
    if (g("fAlerts")) g("fAlerts").onchange = function (e) { FS().setOptions({ alerts: e.target.checked }); };
    if (g("fBt")) g("fBt").onchange = function (e) { try { FS().sound.setKeepAlive(e.target.checked); } catch (err) {} };
    if (g("fShots")) g("fShots").onchange = function (e) { FS().setOptions({ shots: e.target.checked }); };
    if (g("fAway")) g("fAway").onchange = function (e) { FS().setOptions({ awayOnTurn: e.target.checked }); };
    if (g("fBg")) g("fBg").onchange = function (e) {
      FS().setOptions({ bgMode: e.target.checked });
      // 세션이 이미 돌고 있으면 다음 세션부터 적용된다는 걸 알려준다
      if (FS().running) g("fBg").parentElement.insertAdjacentHTML("afterend",
        '<span class="fdim" style="font-size:11px">— 다음 측정부터 적용</span>');
    };
    if (g("fClearShots")) g("fClearShots").onclick = async function () {
      var msg = g("fShotsMsg");
      try {
        var n = await FS().clearShots();
        if (focusLastSession && focusLastSession.shots) focusLastSession.shots = [];
        if (msg) msg.textContent = n + "장 삭제됨";
        renderFocusPanel();
        if (document.getElementById("fShotsMsg")) document.getElementById("fShotsMsg").textContent = n + "장 삭제됨";
      } catch (err) { if (msg) msg.textContent = "삭제 실패"; }
    };
  }

  async function enableFocus() {
    var btn = document.getElementById("fEnable");
    if (btn) { btn.disabled = true; btn.textContent = "초기화 중…"; }
    var loaded = await loadSensor();
    if (!loaded) {
      focusBody.innerHTML = '<h3>집중 측정</h3><div class="fwarn">focus-sensor.js 를 불러오지 못했습니다. ' +
        '파일이 같은 폴더에 있는지 확인하세요.</div>';
      return;
    }
    try { FS().sound.init(); } catch (e) {}   // AudioContext 는 사용자 제스처에서 생성
    renderFocusPanel();
    focusReady = await FS().init(focusCk);
    if (focusReady) {
      var saved = await FS().loadCal();
      if (saved) focusCal = saved;
    }
    renderFocusPanel();
  }

  async function runCalibration() {
    if (focusCalibrating) return;
    focusCalibrating = true;
    focusBody.innerHTML = '<h3>캘리브레이션</h3>' +
      '<div class="fstage" id="fcStage">A단계 · 1/3</div>' +
      '<div class="finstr" id="fcInstr">—</div>' +
      '<div class="fdim" id="fcHint"></div>' +
      '<div class="fcnt" id="fcCnt">0</div>' +
      '<div class="fbar"><i id="fcBar"></i></div>' +
      '<div class="frow"><span class="fdim">얼굴 인식 <b id="fcOk">—</b> · EAR <b id="fcEar">—</b> · faceH <b id="fcFh">—</b></span></div>' +
      '<div class="frow"><button class="fbtn" id="fcAbort">중단</button></div>';
    document.getElementById("fcAbort").onclick = function () { FS().abortCalibration(); };

    var r = await FS().calibrate(function (p) {
      var g = function (id) { return document.getElementById(id); };
      if (!g("fcStage")) return;
      g("fcStage").textContent = p.key + "단계 · " + (p.stage + 1) + "/3";
      g("fcInstr").textContent = p.instr;
      g("fcHint").textContent = p.hint;
      g("fcCnt").textContent = Math.ceil(p.left);
      g("fcBar").style.width = (p.frac * 100) + "%";
      g("fcOk").textContent = (p.okRate * 100).toFixed(0) + "%";
      g("fcEar").textContent = p.m ? p.m.ear.toFixed(3) : "—";
      g("fcFh").textContent = p.m ? p.m.faceH.toFixed(2) : "—";
    });
    focusCalibrating = false;
    var saveFailed = false;
    if (r.cal) {
      focusCal = r.cal;
      // 저장이 실패해도 이번 세션은 메모리 값으로 돌아간다. 다만 조용히 넘어가면
      // 다음에 열었을 때 "다시 측정하라"는 말만 보게 되므로 실패를 화면에 남긴다.
      saveFailed = !(await FS().saveCal(focusCal));
    }
    renderFocusPanel();
    if (r.error) {
      focusBody.insertAdjacentHTML("afterbegin", '<div class="fwarn">' + r.error + '</div>');
    } else if (saveFailed) {
      focusBody.insertAdjacentHTML("afterbegin", '<div class="fwarn">캘리브레이션은 잘 됐지만 ' +
        '저장에 실패했습니다. 이번 세션은 그대로 쓸 수 있지만 창을 닫으면 사라집니다. ' +
        '(브라우저 저장소가 막혀 있거나 용량이 꽉 찬 경우)</div>');
    }
  }

  function openFocusPanel() {
    focusDim.classList.add("open");
    focusPanel.classList.add("open");
    renderFocusPanel();
  }
  function closeFocusPanel() {
    focusDim.classList.remove("open");
    focusPanel.classList.remove("open");
  }
  function toggleFocusPanel() {
    if (focusPanel.classList.contains("open")) closeFocusPanel(); else openFocusPanel();
  }

  focusBtn.addEventListener("click", function (e) {
    toggleFocusPanel();
    if (e.target && e.target.blur) e.target.blur();
  });
  focusCloseBtn.addEventListener("click", closeFocusPanel);
  focusDim.addEventListener("click", closeFocusPanel);

  // 창을 닫기 전에 마지막 스냅샷을 남긴다 (1분 주기 스냅샷의 빈틈 메우기).
  // stop() 을 부르면 안 된다 — BFCache 로 되살아나는 경우 타이머는 계속 도는데
  // 센서만 죽은 채로 돌아온다. 저장만 하고 센서는 살려 둔다.
  window.addEventListener("pagehide", function () {
    try { if (FS() && FS().running) FS().snapshot(); } catch (e) {}
  });
  // BFCache 복귀. 이때 타이머 상태와 센서 상태가 어긋나 있을 수 있으므로 다시 맞춘다.
  window.addEventListener("pageshow", function (e) {
    if (!e.persisted) return;
    try { focusOnTimerChange(); updateFocusChip(); } catch (err) {}
  });

  // ══════════════════════════════════════════════════════════════════
  // 직접 추가한 시간 (열품타 등 외부에서 잰 기록)
  //
  // 저장 키는 studyExt_YYYY-MM-DD. studyTime_ 접두사를 쓰면 안 된다 —
  // 동기화가 studyTime_ 뒤를 통째로 날짜 키로 파싱하기 때문에 섞이면 깨진다.
  // 측정한 시간과 직접 넣은 시간은 합산해서 보여주되 내부적으로는 분리해 둔다.
  // 어디까지가 실제로 잰 값인지 흐려지면 기록 자체를 못 믿게 된다.
  // (현재 기기에만 저장된다. 기기 간 동기화는 studyTime_ 만 대상으로 한다)
  // ══════════════════════════════════════════════════════════════════
  var EXT_PREFIX = "studyExt_";
  var STUDY_FIX_PREFIX = "studyFix_";   // 이 날 측정 기록을 사용자가 직접 고쳤다는 표시
  var EXT_OPEN_KEY = "studyTimer_extOpen";
  var DEFAULT_SUBJECTS = ["국어", "수학", "영어", "지구", "세지"];
  var extViewOffset = 0;      // 0 = 오늘, 1 = 어제 …
  var extSubject = null;      // 선택된 과목

  function extEntriesForKey(key) {
    try {
      var raw = localStorage.getItem(EXT_PREFIX + key);
      if (!raw) return [];
      var arr = JSON.parse(raw);
      return Array.isArray(arr) ? arr : [];
    } catch (e) { return []; }
  }
  function extTotalMsForKey(key) {
    return extEntriesForKey(key).reduce(function (sum, e) {
      return sum + (typeof e.ms === "number" && e.ms > 0 ? e.ms : 0);
    }, 0);
  }
  function extSaveForKey(key, arr) {
    try {
      if (arr.length) localStorage.setItem(EXT_PREFIX + key, JSON.stringify(arr));
      else localStorage.removeItem(EXT_PREFIX + key);
      return true;
    } catch (e) { return false; }
  }
  // 항목의 과목 이름. 예전에 label 로 저장한 것도 그대로 읽힌다.
  function extNameOf(e) { return e.subject || e.label || "과목 없음"; }

  // 과목 목록을 따로 관리하지 않는다. 기본값 + 최근 30일에 실제로 쓴 것을 합쳐서
  // 앞글자 매칭 후보로만 쓴다. 목록에 없는 이름도 그냥 추가되며(새 과목),
  // 오타를 조용히 새 과목으로 만들지 않도록 미리보기에서 다르게 표시한다.
  function extSubjects() {
    var seen = {}, out = [];
    DEFAULT_SUBJECTS.forEach(function (n) { if (!seen[n]) { seen[n] = 1; out.push(n); } });
    for (var i = 0; i < 30; i++) {
      extEntriesForKey(dayKeyForOffset(i)).forEach(function (e) {
        var n = extNameOf(e);
        if (n && !seen[n]) { seen[n] = 1; out.push(n); }
      });
    }
    return out;
  }

  var extToggleEl = document.getElementById("extToggle");
  var extSectionEl = document.getElementById("extSection");
  var extHeadSumEl = document.getElementById("extHeadSum");
  var extPrevBtn = document.getElementById("extPrev");
  var extNextBtn = document.getElementById("extNext");
  var extDateLabel = document.getElementById("extDateLabel");
  var extQuickInput = document.getElementById("extQuick");
  var extPreviewEl = document.getElementById("extPreview");
  var extAddBtn = document.getElementById("extAddBtn");
  var extListEl = document.getElementById("extList");
  var extSummaryEl = document.getElementById("extSummary");
  var extWeekEl = document.getElementById("extWeek");

  function extViewKey() { return dayKeyForOffset(extViewOffset); }

  function extSetOpen(open) {
    extSectionEl.hidden = !open;
    extToggleEl.classList.toggle("open", open);
    try { localStorage.setItem(EXT_OPEN_KEY, open ? "1" : "0"); } catch (e) {}
    if (open) { renderExtPanel(); extQuickInput.focus(); }
  }

  function renderExtPanel() {
    var key = extViewKey();
    var d = dateForDayOffset(extViewOffset);
    extDateLabel.innerHTML = (d.getMonth() + 1) + "월 " + d.getDate() + "일 (" +
      KOREAN_WEEKDAYS[d.getDay()] + ")" +
      "<small>" + (extViewOffset === 0 ? "오늘" : extViewOffset + "일 전") + "</small>";
    extNextBtn.disabled = extViewOffset === 0;
    extPrevBtn.disabled = extViewOffset >= 29;

    var entries = extEntriesForKey(key);
    extListEl.innerHTML = "";
    if (!entries.length) {
      var empty = document.createElement("div");
      empty.id = "extEmpty";
      empty.textContent = "이 날 직접 추가한 기록이 없습니다.";
      extListEl.appendChild(empty);
    } else {
      entries.forEach(function (e, idx) {
        var row = document.createElement("div");
        row.className = "ext-item";
        var name = document.createElement("div");
        name.className = "ext-name";
        name.textContent = extNameOf(e);
        var ms = document.createElement("div");
        ms.className = "ext-ms";
        ms.textContent = formatStudyTime(e.ms);
        var del = document.createElement("button");
        del.className = "ext-del";
        del.textContent = "×";
        del.title = "삭제";
        del.tabIndex = -1;    // 항목이 늘어날수록 탭 순서를 잡아먹는다. ⌘Z 로 취소하면 된다.
        del.onclick = function () { extRemove(key, idx); };
        row.appendChild(name); row.appendChild(ms); row.appendChild(del);
        extListEl.appendChild(row);
      });
    }

    var measured = parseInt(localStorage.getItem("studyTime_" + key) || "0", 10) || 0;
    var added = extTotalMsForKey(key);
    var remote = totalStudyMsForKey(key) - measured - added;
    var parts = ['측정 <b id="extMeasured">' + formatStudyTime(measured) + '</b>'];
    if (remote > 0) parts.push("다른 기기 <b>" + formatStudyTime(remote) + "</b>");
    parts.push("추가 <b>" + formatStudyTime(added) + "</b>");
    extSummaryEl.innerHTML = parts.join(" + ") +
      " = 합계 <b>" + formatStudyTime(totalStudyMsForKey(key)) + "</b>" +
      (measured > 0 ? ' <button id="extFix" type="button">고치기</button>' : "");

    // 측정 시간 정정. 통째로 지우는 게 아니라 값을 고친다 —
    // 타이머를 실수로 켜둔 몇 분만 빼고 나머지는 남겨야 하는 경우가 대부분이다.
    var fixBtn = document.getElementById("extFix");
    if (fixBtn) fixBtn.onclick = function () {
      var cur = Math.round(measured / 60000);
      extSummaryEl.innerHTML =
        '측정 <input id="extFixInput" type="number" min="0" max="1440" value="' + cur + '"> 분으로 ' +
        '<button id="extFixOk" type="button">확인</button> ' +
        '<button id="extFixNo" type="button">취소</button>' +
        '<div class="note" style="margin-top:6px">지금 ' + formatStudyTime(measured) +
        ' 입니다. 실수로 켜둔 만큼 빼서 적으세요. 0 을 넣으면 그 날 측정 기록이 없어집니다.</div>';
      var inp = document.getElementById("extFixInput");
      inp.focus(); inp.select();
      var apply = function () {
        var m = parseInt(inp.value, 10);
        if (isNaN(m) || m < 0) { inp.focus(); return; }
        localStorage.setItem("studyTime_" + key, String(m * 60000));
        // 이 표시가 없으면 다음 동기화 때 max 병합으로 원래 값이 되살아난다.
        localStorage.setItem(STUDY_FIX_PREFIX + key, String(Date.now()));
        extAfterChange();
      };
      document.getElementById("extFixOk").onclick = apply;
      document.getElementById("extFixNo").onclick = function () { renderExtPanel(); };
      inp.onkeydown = function (e) {
        e.stopPropagation();
        if (e.key === "Enter") { e.preventDefault(); apply(); }
        else if (e.key === "Escape") { e.preventDefault(); renderExtPanel(); }
      };
    };

    renderExtWeek();
    renderExtHead();
  }

  // 최근 7일 과목별 합계. 주간 목표를 과목 단위로 볼 수 있게 한다.
  function renderExtWeek() {
    var totals = {}, grand = 0;
    for (var i = 6; i >= 0; i--) {
      extEntriesForKey(dayKeyForOffset(i)).forEach(function (e) {
        var n = extNameOf(e);
        totals[n] = (totals[n] || 0) + (e.ms > 0 ? e.ms : 0);
        grand += (e.ms > 0 ? e.ms : 0);
      });
    }
    var names = Object.keys(totals).sort(function (a, b) { return totals[b] - totals[a]; });
    if (!names.length) { extWeekEl.innerHTML = ""; return; }
    var max = totals[names[0]] || 1;
    var html = '<div class="wk-title">최근 7일 과목별 · 합계 ' + formatStudyTime(grand) + '</div>';
    names.forEach(function (n) {
      html += '<div class="wk-row" data-subject="' + n.replace(/"/g, "&quot;") + '"><div class="wk-name">' + n + '</div>' +
        '<div class="wk-bar"><i style="width:' + Math.max(3, Math.round(totals[n] / max * 100)) + '%"></i></div>' +
        '<div class="wk-ms">' + formatStudyTime(totals[n]) + '</div></div>';
    });
    extWeekEl.innerHTML = html;
    // 마우스로도 쓸 수 있게 — 과목을 누르면 입력칸에 채워 넣는다.
    [].forEach.call(extWeekEl.querySelectorAll(".wk-row"), function (row) {
      row.onclick = function () {
        extQuickInput.value = row.dataset.subject + " ";
        extQuickInput.focus();
        renderExtPreview();
      };
    });
  }

  function renderExtHead() {
    var t = extTotalMsForKey(todayKey());
    extHeadSumEl.textContent = t > 0 ? "오늘 " + formatStudyTime(t) : "";
  }

  function extRemove(key, idx) {
    var entries = extEntriesForKey(key);
    if (idx < 0 || idx >= entries.length) return;
    entries.splice(idx, 1);
    extSaveForKey(key, entries);
    extAfterChange();
  }

  // ── 한 줄 입력 파서 ──
  // "국 145" / "국어 145" / "국어 1:45" / "국어 1시간45분" / "145" 를 모두 받는다.
  // 맨 숫자는 자릿수로 가른다: 1~2자리는 분, 3~4자리는 시+분.
  //   45 → 45분   90 → 90분   145 → 1시간 45분   1030 → 10시간 30분
  // 3~4자리인데 뒤 두 자리가 60 이상이면(175 등) 시·분으로 못 읽으므로 전체를 분으로 본다.
  function extParseDuration(txt) {
    var t = (txt || "").replace(/\s+/g, "");
    if (!t) return null;
    var m;
    // 1:45 / 1;45
    if ((m = t.match(/^(\d{1,2})[:;](\d{1,2})$/))) {
      var mm = parseInt(m[2], 10);
      if (mm > 59) return null;
      return (parseInt(m[1], 10) * 60 + mm) * 60000;
    }
    // 1시간45분 / 1시간45 / 1h45 / 1시간
    if ((m = t.match(/^(\d{1,2})\s*(?:시간|시|h|H)\s*(\d{1,2})?\s*(?:분|m|M)?$/))) {
      var mm2 = m[2] ? parseInt(m[2], 10) : 0;
      if (mm2 > 59) return null;
      return (parseInt(m[1], 10) * 60 + mm2) * 60000;
    }
    // 45분 / 45m
    if ((m = t.match(/^(\d{1,3})\s*(?:분|m|M)$/))) return parseInt(m[1], 10) * 60000;
    // 맨 숫자
    if ((m = t.match(/^(\d{1,4})$/))) {
      var d = m[1];
      if (d.length <= 2) return parseInt(d, 10) * 60000;
      var h = parseInt(d.slice(0, d.length - 2), 10);
      var mi = parseInt(d.slice(-2), 10);
      if (mi > 59) return parseInt(d, 10) * 60000;   // 175 → 175분
      return (h * 60 + mi) * 60000;
    }
    return null;
  }

  // "국 145" → { subject: "국어", ms: … }. 과목을 안 쓰면 지금 선택된 과목을 쓴다.
  function extParseEntry(raw) {
    var txt = (raw || "").trim();
    if (!txt) return null;
    // 공백이 있으면 첫 덩어리를 과목으로 본다("국어 어쩌구"가 과목명으로 먹히지 않게).
    // 공백이 없으면 앞쪽 비숫자만 떼어낸다("국145" 도 되게).
    var namePart, timePart;
    var sp = txt.match(/^(\S+)\s+(.*)$/);
    if (sp) { namePart = sp[1]; timePart = sp[2].trim(); }
    else {
      var m = txt.match(/^([^\d:;]*)(.*)$/);
      namePart = (m[1] || "").trim();
      timePart = (m[2] || "").trim();
    }
    var subject = extSubject;
    var isNew = false;
    if (namePart) {
      var subs = extSubjects();
      var hit = null;
      for (var i = 0; i < subs.length; i++) if (subs[i] === namePart) { hit = subs[i]; break; }
      if (!hit) for (var j = 0; j < subs.length; j++) {
        if (subs[j].indexOf(namePart) === 0) { hit = subs[j]; break; }
      }
      if (hit) subject = hit;
      else { subject = namePart; isNew = true; }   // 새 과목 — 미리보기에서 구분해 보여준다
    }
    var ms = extParseDuration(timePart);
    if (ms == null) return { error: "시간을 못 읽었습니다" };
    if (ms <= 0) return { error: "0보다 커야 합니다" };
    return { subject: subject || "과목 없음", ms: ms, isNew: isNew };
  }

  function renderExtPreview() {
    var raw = extQuickInput.value.trim();
    if (!raw) { extPreviewEl.className = ""; extPreviewEl.innerHTML = ""; return; }
    var r = extParseEntry(raw);
    if (!r || r.error) {
      extPreviewEl.className = "bad";
      extPreviewEl.textContent = (r && r.error) || "읽을 수 없습니다";
      return;
    }
    extPreviewEl.className = r.isNew ? "fresh" : "";
    extPreviewEl.innerHTML = "<b>" + r.subject + " · " + formatStudyTime(r.ms) + "</b>" +
      (r.isNew ? " — <b>새 과목</b>입니다. 맞으면 Enter" : " — Enter 로 추가");
  }

  var extLastAdd = null;   // ⌘Z 로 되돌리기

  function extAdd() {
    var r = extParseEntry(extQuickInput.value);
    if (!r || r.error) { renderExtPreview(); extQuickInput.focus(); return; }
    var key = extViewKey();
    var entries = extEntriesForKey(key);
    entries.push({ ms: r.ms, subject: r.subject, at: Date.now() });
    if (!extSaveForKey(key, entries)) return;
    extLastAdd = { key: key, index: entries.length - 1 };
    extSubject = r.subject;
    extQuickInput.value = "";
    extAfterChange();
    extPreviewEl.className = "";
    extPreviewEl.innerHTML = "<b>" + r.subject + " " + formatStudyTime(r.ms) + "</b> 추가됨 — ⌘Z 로 취소";
    extQuickInput.focus();
  }

  function extUndo() {
    if (!extLastAdd) return;
    var entries = extEntriesForKey(extLastAdd.key);
    if (extLastAdd.index < entries.length) {
      entries.splice(extLastAdd.index, 1);
      extSaveForKey(extLastAdd.key, entries);
      extAfterChange();
      extPreviewEl.className = "";
      extPreviewEl.textContent = "취소했습니다";
    }
    extLastAdd = null;
  }

  // 추가·삭제 뒤에는 오늘 표시와 통계까지 같이 갱신해야 한다.
  function extAfterChange() {
    syncStats(true);          // 위젯이 바로 볼 수 있게 즉시 올린다
    renderExtPanel();
    renderStudyTime(totalStudyMsForKey(todayKey()));
    renderStatsPanel();
    statsDayDetail.textContent = "막대나 칸을 클릭·호버하면 날짜별 기록이 보여요";
  }

  extToggleEl.addEventListener("click", function () { extSetOpen(extSectionEl.hidden); });

  // 바탕화면 위젯이 "#add" 로 열면 곧바로 입력할 수 있게 한다.
  // 위젯에서 직접 GitHub 에 쓰면 타이머 동기화가 자기 칸을 덮어써 지워지므로,
  // 추가는 여기 한 곳에서만 일어나게 두고 위젯은 이 화면을 열어주는 역할만 한다.
  function openAddFromHash() {
    if (location.hash !== "#add") return;
    openStats();
    extSetOpen(true);
    setTimeout(function () { extQuickInput.focus(); }, 0);
  }
  window.addEventListener("hashchange", openAddFromHash);
  extAddBtn.addEventListener("click", extAdd);
  extPrevBtn.addEventListener("click", function () {
    if (extViewOffset < 29) { extViewOffset++; renderExtPanel(); }
  });
  extNextBtn.addEventListener("click", function () {
    if (extViewOffset > 0) { extViewOffset--; renderExtPanel(); }
  });
  extQuickInput.addEventListener("input", renderExtPreview);
  extQuickInput.addEventListener("keydown", function (e) {
    e.stopPropagation();     // 타이머 단축키(Space 등)가 입력을 가로채지 않게
    if (e.key === "Enter") { e.preventDefault(); extAdd(); }
    else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "z") { e.preventDefault(); extUndo(); }
  });

  init();
  openAddFromHash();
})();
</script>
</body>
</html>
